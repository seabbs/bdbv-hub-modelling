version: "3"

# The renewal model (nowcastrenewal).
# Included by the root Taskfile.yml as `nowcastrenewal`: run `task nowcastrenewal:<task>` from the
# repository root, or `task <task>` here. Tasks that read or write the
# repository's data/, results/ or output/ run from its root (REPO).

vars:
  REPO: '{{.TASKFILE_DIR}}/../..'

tasks:
  test:
    dir: '{{.REPO}}'
    desc: Run nowcastrenewal's tests (the fast ones; `-- -m ""` for all)
    cmds:
      - uv run pytest -q packages/nowcastrenewal/tests {{.CLI_ARGS}}
