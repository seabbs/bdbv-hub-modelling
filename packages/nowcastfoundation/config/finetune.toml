# Where the fine-tuned Chronos-2 checkpoint the fine-tuned models
# (`foundation`, `foundation_complete`, `foundation_baselinenowcast`) load is read
# from (`nowcastfoundation.forecaster.finetuned_checkpoint`):
# "huggingface" reads [huggingface] `repo` at its pinned `revision`, cached
# by huggingface_hub; "github" the release `hash` names; "local" the
# training segment folder `local`. Every source is checked against the
# adapter's SHA-256. GitHub while no Hub repository is set.
source = "github"

# The GitHub release of the checkpoint
# (`nowcastfoundation.forecaster.resolve_checkpoint`). "latest" is the
# main fine-tuning run's (the paper's `live_run`) newest released
# checkpoint, the one the release `chronos-main` names (rule
# `promote_main`), so each new checkpoint of that run is picked up and
# refits those models, never a hand pin that goes stale; an ablation
# run's release is never taken. A settings hash (`slots-<hash>` or
# `<hash>`) pins that release instead. Either way the adapter is checked
# against the release's sha256sums.txt. The Fit store and the submission
# resolve it once per run (`bdbvhub finetuned-checkpoint`,
# BDBV_CHRONOS_FT), so all their jobs load one checkpoint.
hash = "latest"

# A training segment folder, `<run>/train/n<N>`, for `source = "local"`.
local = ""

# The fine-tuned models' blocks: one joint block of the country, every
# province and the active zones (at least `active_zone_cases` cases in the
# `active_zone_weeks` weeks to the cut-off and one in the last
# `active_zone_recent_weeks`, as reported then), and one block per
# province of the province and all its zones, from which every other zone
# takes its forecast (`nowcastfoundation.forecaster.active_views`). Leave
# `active_zone_cases` out for every zone in the joint block.
active_zone_cases = 20
active_zone_weeks = 8
active_zone_recent_weeks = 4

# The Chronos-2 checkpoint fine-tuned on real data alone, the German
# development half and the public BDBV data up to the release below
# (`[realdata_germany]`, `[realdata_bdbv]`), that the SI-only
# `foundation_real` model loads: the settings hash of the release
# `realdata-ft-<hash>`, which the workflow's `realdata` run publishes
# (`task workflow:finetune-realdata`). Empty until that release is
# published.
realdata = ""

# The German data the real-data checkpoint trained on
# (`nowcastgermany.finetune_blocks.realdata_window`): the hub triangle as
# available on `as_of`, the last day of the German development half
# (packages/nowcastgermany/config/germany.toml `split_date` less a day),
# cut at every nowcast date from `first_cut` whose truth, four weeks
# ahead, is at least `truth_delay` days old by `as_of`, each date's tasks
# laid out as the fine-tuned model forecasts them. The last
# `held_out_dates` nowcast dates are held out to monitor the loss.
[realdata_germany]
as_of = "2022-02-09"
truth_delay = 40
first_cut = "2021-04-20"
held_out_dates = 14

# The BDBV data the real-data checkpoint trained on: every public release
# up to `release` (cut-off `cutoff`), with truth masked after `truth_until`,
# the cut-off less `truth_delay` days (the release backtest's BDBV truth
# delay on these releases). The SI scores the real-data models on BDBV only
# from the rounds after `release`, so it is scored prospectively.
[realdata_bdbv]
release = "2026-11-08"
cutoff = "2026-11-05"
truth_delay = 35
truth_until = "2026-10-01"

# The Hugging Face Hub repository (`<owner>/<name>`) and the revision (a
# tag or a commit hash) pinned for `source = "huggingface"`. Empty until
# the repository is chosen. `publish_hf` (rules/publish.smk) uploads to
# `repo`.
[huggingface]
repo = ""
revision = ""
