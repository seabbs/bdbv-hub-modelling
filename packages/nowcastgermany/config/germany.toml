# German COVID-19 hospitalisation nowcast benchmark (Wolffram et al. 2023,
# PLOS Comp Biol, doi:10.1371/journal.pcbi.1011394). Read by
# `nowcastgermany.evaluation.load_germany_config`.
# `nowcastgermany fetch` downloads the files below at these commits
# into data/raw/germany/, which is not committed. The data come from the
# Robert Koch Institute (CC BY 4.0) through the hub.

[hub]
# The reporting triangle by Meldedatum, as of 2022-08-08.
repo = "KITmetricslab/hospitalization-nowcast-hub"
commit = "11c745322c055cfbd4f0c8f72241642a50aea399"
triangle = "data-truth/COVID-19/COVID-19_hospitalizations.csv"

[teams]
# The paper's evaluation repository (MIT), with the hub teams' submitted
# quantiles as it gathered them.
repo = "dwolffram/hospitalization-nowcast-hub-evaluation"
commit = "0081bad6deca43e19570c37dd91cd405138fab41"
submissions = [
  "data/submissions.csv.gz",
  "data/submissions_KIT-frozen_baseline.csv.gz",
]

[nowcast]
# The paper's nowcast dates, every day of its evaluation period.
first_date = "2021-11-22"
last_date = "2022-04-29"
# The first date of the held-out half, the midpoint of the dates above:
# 2021-11-22 to 2022-02-09 (80 dates) are for development, 2022-02-10 to
# 2022-04-29 (79 dates) are held out for the paper and not scored here.
split_date = "2022-02-10"
# Nowcast dates and scores are the hub's submission window above. The
# plots show the truth from this day on as context, the first whose 7-day
# sum ending 28 days before it starts on the triangle's first day,
# 2021-04-06; every task holds the triangle from its start.
plot_start = "2021-05-10"
# Days ahead of each nowcast date the checkpoint units also forecast, the
# zero-shot reference and every checkpoint alike: 7-day sums ending up to
# 28 days after it (4 weeks), as the held-out loss splits them. The hub's
# horizons, 0 to 28 days back, stay the scored nowcast.
forecast_days = 28
# The views the checkpoint units forecast and the page shows, both on daily
# data: the hub's 7-day rolling sums (`7day`) and each day's count
# (`daily`), each scored on its truth as reported 40 days after it ends.
# Daily counts come from the models with their own quantiles of them (the
# ragged and complete Chronos-2 models and randomwalknowcast_daily).
targets = ["7day", "daily"]
# Germany is scored and shown on daily data only: every model takes the
# daily releases with real dates (no weekly source or steps) and forecasts
# every day. randomwalknowcast_daily is baselinenowcast on the daily
# triangle with a daily random walk: its 7-day sums have their errors
# fitted on 7-day rolling sums, its daily counts on daily counts. The
# checkpoint units run the models listed here.
models = [
  "randomwalknowcast_daily",
  "foundation_zeroshot_complete",
  "foundation_zeroshot",
  "foundation",
  # The two-step sensitivity analysis (#538): baselinenowcast's point
  # nowcast, then Chronos-2's complete layout, zero-shot and fine-tuned.
  "foundation_zeroshot_twostep",
  "foundation_twostep",
]
# Chronos-2 fine-tuned on real data alone (the German development half and
# BDBV to date), run on the held-out half only, for the SI's comparison
# with the models fine-tuned on simulations. Its checkpoint is released as
# realdata-ft-<hash> and pinned by `realdata` in packages/nowcastfoundation/config/finetune.toml; the
# model is registered only once that pin is set (it is empty now), and its
# training is not a workflow rule. The workflow's real-data run is
# different: `runs.realdata` in workflow/config.yaml mixes German real-data
# blocks into Run A's simulations.
held_out_models = [
  "foundation_real",
]
# Draws per forecast and their seed, the same for every model. A model's own
# quantiles at the hub's seven levels are scored where it gives them (the
# ragged Chronos-2 models); every other forecast is scored from the
# quantiles of its draws.
n_samples = 1000
seed = 20261027

[scoring]
# Relative scores on the page divide by this model.
baseline = "randomwalknowcast_daily"
# The paper's relative scores divide by the hub's own baseline, as
# Wolffram et al. (2023) compare to it.
paper_baseline = "KIT-frozen_baseline"
# Relative scores on daily counts divide by zero-shot Chronos-2 (ragged).
daily_baseline = "foundation_zeroshot"

[page]
# Models switched off on the page until the reader switches them on. Both
# stay in the scores and in the paper's table.
hidden = ["KIT-frozen_baseline"]
# The nowcast plots show every this many development dates, from the first.
plot_every = 7

[truth]
# Each 7-day sum is scored on the data reported this many days after it
# ends, the paper's 40-day truth.
delay = 40
