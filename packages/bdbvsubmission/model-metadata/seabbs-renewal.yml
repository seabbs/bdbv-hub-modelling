model_details:
  data_inputs: Hub weekly cases by onset week (observed plus imputed) and reporting delays by release. Zone populations and locations. BVDOutbreakSize's generation interval and incubation period priors. Rt from the newest BVDOutbreakSize release before the cut-off.
  methods: A pooled renewal model of health zones with importation and depletion, and Rt informed by BVDOutbreakSize. Provinces and the country are zone sums.
  methods_long: 'We fit a renewal model in PyRenew to the health zones with recent cases. Log Rt is a national weekly AR(1) with pooled province and zone deviations. Infections move between zones through a gravity kernel, and susceptibles are depleted. Zones with no recent case only receive imported infections. Rt in the week of the newest BVDOutbreakSize release is fitted to that release''s estimates, with their SDs inflated by 1.5. The model includes the incubation period, reporting delays, right truncation, the share confirmed and the hub''s onset imputation. It is fitted with NUTS in NumPyro to each release. Provinces and the country are sums of zones. seabbs-renewal submits the first model to pass its checks, in order: the zone model with BVDOutbreakSize Rt, single-zone models, the zone model, a random walk from a nowcast and a random walk. See https://samabbott.co.uk/bdbv-hub-modelling/methods/model/. We also submit the wk R_t target. It is the model''s weekly effective reproduction
    number by week of infection. Please note two points. First, it is estimated from the hub''s onsets, including imputed onsets (https://github.com/InsightNet-US/BDBV-Modeling-Hub/issues/61), so it is likely to react more slowly than transmission and to be out of phase with the outbreak. Second, the hub collects quantiles, so quantiles joined across weeks or locations do not describe a trajectory. For a less affected Rt estimate, see the BVDOutbreakSize summary (https://epiforecasts.io/BVDOutbreakSize/stable/).'
