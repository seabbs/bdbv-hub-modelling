model_details:
  data_inputs: Hub daily onsets by release (observed plus imputed) for provinces and health zones.
  methods: A chain-ladder nowcast (baselinenowcast) of each province and zone, carried forward as a log-scale random walk. The country sums the provinces.
  methods_long: We nowcast each province and health zone with a JAX port of baselinenowcast (Johnson et al. 2025, doi:10.12688/wellcomeopenres.25027.2). The delay is fitted to release pairs up to 42 days apart. Cases still to be reported are negative binomial, with dispersion fitted to past nowcasts. Each draw follows a log-scale random walk with Poisson noise. Zones are forecast from their own data. Places under 10 cases a week use their parent's delay and spread. A Gaussian copula pairs the province draws within each week. See https://samabbott.co.uk/bdbv-hub-modelling/methods/baselines/.
website_url: https://samabbott.co.uk/bdbv-hub-modelling/
