version: "3"

tasks:
  test:
    desc: Run the paper tests
    cmds:
      - uv run --group paper pytest -q tests
  lint:
    desc: Lint and format-check the paper code
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
  pipeline:dev:
    desc: Run the evaluation workflow without the held-out data, to paper/results/development/
    # The paper is a target of the project workflow, run from the root, as
    # `task paper` runs it (workflow/scripts/paper_run.py: this machine's
    # cores, niced, logged to PAPER_LOGS).
    dir: ..
    cmds:
      - uv run --group paper python workflow/scripts/paper_run.py --targets development {{.CLI_ARGS}}
  pipeline:paper:
    desc: Run the evaluation workflow with the held-out data, to paper/results/paper/
    # The paper is a target of the project workflow, run from the root.
    dir: ..
    cmds:
      - uv run --group paper python workflow/scripts/paper_run.py --targets paper {{.CLI_ARGS}}
  render:
    desc: Run the development target and render the paper (HTML and PDF) from it
    # The paper is a target of the project workflow, run from the root.
    dir: ..
    cmds:
      - uv run --group paper python workflow/scripts/paper_run.py --targets render {{.CLI_ARGS}}
  pipeline:dry:
    desc: Dry-run both workflow targets to check the DAG
    # The paper is a target of the project workflow, run from the root.
    dir: ..
    cmds:
      - uv run --group paper snakemake -s workflow/Snakefile development paper -n --cores 1
  targets:
    desc: "Run single paper workflow targets as `task paper` runs the paper: task paper:targets -- TARGET..."
    dir: ..
    cmds:
      - uv run --group paper python workflow/scripts/paper_run.py --targets {{.CLI_ARGS}}
