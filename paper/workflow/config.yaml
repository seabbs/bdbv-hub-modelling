# Settings of the paper's evaluation workflow (`workflow/Snakefile`).
# Paths are relative to the repository root.
results: paper/results
# Where `publish` copies a run's outputs for main.qmd and si.qmd.
build: paper/build
# Whether this run makes the hosts' outputs: the German pairing
# sensitivity. Pages sets it false and reads the published copy
# (`paperpipe.stored`).
host_outputs: true
# The run `render` publishes first: development or paper.
render: development
studies: [synthetic, germany, ebola]
# The paper's final fine-tuning run: its folder, a `runs` entry of the
# workflow (workflow/config.yaml), under the machine's ROOT. Every `_ft`
# model loads its final checkpoint, train/n<last prefix>, whose release
# record (published.json, rule publish_checkpoint) is an input of each
# rule that runs one, so a new final checkpoint reruns them. Null leaves
# the run out and the fine-tuned forecasts pending.
final_run: $ROOT/runs/runa
# The fine-tuning runs' folder under the machine's ROOT (the workflow's
# runs): each run in `live_run` and `comparisons` has an SI progress figure
# from its own reports (rule progress_<run>). Null leaves them out.
runs_dir: $ROOT/runs
# The simulation rounds' folder under the machine's ROOT (the workflow's
# rounds): the SI's realism reads the grid's training rounds
# (`grid_rounds.rounds`) and the German development half's statistics.
# Null leaves the rounds out, and what reads them pending.
rounds_dir: $ROOT/rounds
# The live fine-tuning run (the checkpoint scores' `run`, its workflow
# run name) whose newest scored checkpoints the SI comparisons and
# tables show as preliminary.
live_run: runa
# The branches whose commits may promote an endpoint (the release
# `<endpoint>-main` naming its current version, `nowcastutils.pointers`):
# rules promote_main and promote_paper_<set> refuse any other commit.
promote_branches: [main, next]
# The fine-tuning comparisons (`paperpipe.evidence.COMPARISONS`): each
# compares the live run with the workflow run named here (the workflow
# config's `runs`), from `evidence.checkpoint_scores`. A comparison waits
# until its run has a scored checkpoint.
comparisons:
  slots: noslots
  delays: nodelays
  realdata: realdata
# Samples per forecast for the studies scored on samples.
n_samples: 100

# The simulated outbreaks of each run's seeds (`paperdata.synthetic`), and
# the models' forecasts of them, which the synthetic runner
# writes as the paper's long table.
synthetic:
  # The grid config the grid tables and SI notes are read from (the
  # main workflow's `simulate.grid_file`), and the held-out set's design.
  grid_file: packages/nowcastfoundation/config/finetune/grid.yaml
  simulations_per_seed: 20
  # Draws per forecast of each model on the held-out simulations.
  samples: 1000
  # Example simulations for the SI figure (`paperfigs.sim_examples`),
  # from the workflow's validation round (`rounds_dir`), each `<seed>-<n>`
  # with its label.
  examples:
    picks:
      - [33325-0008, Multi-wave over 53 weeks]
      - [33300-0001, Concentrated spread]
      - [33300-0014, Bunched reports]
      - [33300-0010, Delay slowdown]
      - [33300-0002, Places by age groups]
      - [33300-0003, Poisson observations]
  # The simulations of each run's seeds, whose settings give the grid's
  # realised values.
  simulations:
    development: $ROOT/rounds/r33/sims
    # The run's test round's folder under the rounds folder (ROOT in
    # config/local.env), held out whole (workflow config `grid_rounds`).
    paper: $ROOT/rounds/r38/sims
  # The synthetic runner's forecasts of them, with its
  # observations and factors beside them.
  forecasts:
    development: output/paper/synthetic-dev.csv.gz
    paper: output/paper/synthetic.csv.gz

# The German benchmark, run with the `bdbvhub` command line
# (packages/nowcastgermany/config/germany.toml). Its models are the config's `models`.
# `real: false` runs the study on dummy data.
germany:
  real: true
  config: packages/nowcastgermany/config/germany.toml
  data: data/raw/germany
  results: results/germany
  # The fine-tuning workflow's German units (<SCORE_CACHE>/germany-days),
  # whose reference unit and the final run's final checkpoint's unit
  # (under `final_run`) are our development forecasts: no German backtest
  # runs for the development half.
  units: $SCORE_CACHE/germany-days
  # Further forecasts of the benchmark from evidence rows (`evidence`
  # below), such as models run outside packages/nowcastgermany/config/germany.toml: `models`
  # keeps the models matching a regular expression, `suffix` renames
  # them, and `backtest` reads a `nowcastgermany backtest` table. A development
  # run fails if one holds a held-out date.
  # `provisional` notes what is to be redone, in every German caption.
  # The Chronos-2 models are in packages/nowcastgermany/config/germany.toml.
  extra: []

# The Ebola study: samples of the release backtest of `backtest_models`
# from every past release, with the stored fits' (`bdbvhub
# backtest`, after `fit-store load` on CI), the hub's releases, and once
# the hub's baseline has a forecast with known truth, every team's
# forecasts from the hub, our submissions among them, and our unsubmitted
# models' from each round's release. `hub: null` runs the study on dummy
# data.
ebola:
  backtest: results/forecasts.csv.gz
  # Main's data, whose releases give the observations and truth, and the
  # backtest config, which sets D, as the release backtest takes them.
  data: data
  config: packages/nowcastbdbv/config/backtest.toml
  # Further models' release-backtest samples from evidence rows
  # (`evidence` below), in the backtest's layout, kept to `models`.
  extra: []
  backtest_models: [randomwalk, randomwalknowcast]
  # Draws per forecast of the paper's own run of `backtest_models`, with
  # the backtest's seed shared by every model (common random numbers).
  # Their rows replace the site backtest's, which keeps its own number.
  n_samples: 1000
  hub: data/raw/bdbv-hub
  hub_repo: https://github.com/InsightNet-US/BDBV-Modeling-Hub.git
  # Our models a round did not submit, from that round's release
  # (`round-<reference date>`), whose asset holds every model's forecast
  # in the hub's format; the ledger branch's table says which model went
  # out under each hub id (rule round_releases).
  round_releases:
    repo: seabbs/bdbv-hub-modelling
    ledger: submission-ledger
    asset: hub.zip

# What the nowcast panels show (`paperfigs.nowcasts`). The main panel
# shows the national series of a case study, or one synthetic outbreak;
# the SI shows the other places, or outbreaks covering the levels of
# `factors`. Outbreaks and origins are drawn with `seed`. Models without
# forecasts are left out.
nowcasts:
  seed: 20261114
  origins: 3
  outbreaks: 6
  # The places of the SI nowcast figure, one per entry: the largest,
  # median and smallest (with any cases) by recent count, and the most
  # rising and most falling (`paperfigs.nowcasts.pick_places`).
  place_rule: [largest, median, small, rising, falling]
  factors: [trajectory, delay_form, observation, strata]
  national: {germany: DE, ebola: CD}
  models:
    # The main nowcast and score figures of every study show the same four
    # models: the baseline, zero-shot Chronos-2 on complete data and on the
    # ragged layout, and the fine-tuned ragged model, all daily. Every other model is in the SI only.
    synthetic: &main_models
      - randomwalknowcast
      - foundation_zeroshot_complete
      - foundation_zeroshot
      - foundation
    germany: *main_models
    ebola: *main_models

# SI results kept as rows committed to evidence
# branches (`paperpipe.evidence`). Each is `{ref: <commit>, path: <file>}`;
# null leaves a note of what it waits on in a development run and fails a
# paper run.
evidence:
  # Scores of every run's checkpoints on the German development half and
  # the trainer's validation loss, the workflow's comparison (rule
  # comparison). The live run's newest scored checkpoints are shown as
  # preliminary (nowcastfoundation.live_checkpoint).
  checkpoint_scores:
    file: $ROOT/runs/comparison.csv
  # Each run's checkpoints on daily counts and on the 7-day sums, relative
  # to the German config's references (workflow rule compare_daily).
  compare_daily:
    file: $ROOT/runs/compare-daily.csv
  # The realised shares of each combination of block layout and options
  # (rule block_combinations). From the no-slots run, which cuts the same
  # blocks as Run A.
  block_combinations:
    file: $ROOT/runs/noslots/train/block-combinations.csv

# Data the development runs use.
development:
  # The run's validation round 33, 40 batches of 20 (seeds 33300 to
  # 33339), for checking the setup.
  synthetic_seeds: [
    33300, 33301, 33302, 33303, 33304, 33305, 33306, 33307, 33308, 33309,
    33310, 33311, 33312, 33313, 33314, 33315, 33316, 33317, 33318, 33319,
    33320, 33321, 33322, 33323, 33324, 33325, 33326, 33327, 33328, 33329,
    33330, 33331, 33332, 33333, 33334, 33335, 33336, 33337, 33338, 33339,
  ]

# Data kept out of every development run.
# Only the `paper` target reads them.
heldout:
  # Outbreaks simulated with seeds the fine-tune never saw: the run's
  # test round 38, 40 batches of 20 (seeds 33800 to 33839).
  synthetic_seeds: [
    33800, 33801, 33802, 33803, 33804, 33805, 33806, 33807, 33808, 33809,
    33810, 33811, 33812, 33813, 33814, 33815, 33816, 33817, 33818, 33819,
    33820, 33821, 33822, 33823, 33824, 33825, 33826, 33827, 33828, 33829,
    33830, 33831, 33832, 33833, 33834, 33835, 33836, 33837, 33838, 33839,
  ]
  # First held-out German nowcast date.
  # The benchmark's dates run from 2021-11-22 to 2022-04-29.
  # The first 80 are the development half.
  germany_from: "2022-02-10"
  # The Ebola study is held out entirely: development runs leave it out,
  # and a paper run scores every round from this date, the first release
  # backtest vintage (`first_vintage`, packages/nowcastbdbv/config/backtest.toml), so no
  # round is a development part. Each round keeps the last release
  # before it closed.
  ebola_from: "2026-06-27"

# Studies whose truth is the first release on or after D days, as the
# release backtest takes it, rather than the last release before.
truth_first_after: [ebola]

# D, the days after a target date at which the truth is taken.
# Synthetic outbreaks use their own 98% reporting delay.
# Ebola uses the release backtest's (packages/nowcastbdbv/config/backtest.toml).
truth_delay:
  germany: 40
