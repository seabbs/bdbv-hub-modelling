# Comparison with hub forecasts. Read by
# `bdbvhub.compare.load_comparison_config`.
# `bdbvhub compare-hub --fetch` downloads every team's metadata and
# weekly-round forecasts into data/hub-submissions/ (CC0-1.0 or CC-BY-4.0)
# and data/raw/hub-submissions/ (other licences). Neither is committed.
# The scores and plotted quantiles go to results/hub-comparison/.

[comparison]
# CRPS is relative to this model, or to the registry baseline until it is
# registered.
baseline = "randomwalknowcast"
# Forecasts of fitted models, which are too slow to run here, are taken
# from these files for the same rounds.
stored = [
  "results/forecasts.csv.gz",
  "output/backtest/forecasts.csv.gz",
  # Candidates fitted for the 2026-11-07 round but not submitted (run
  # 41691221605).
  "data/candidate-forecasts.csv.gz",
]
# What we submitted to the hub, as model-output/<hub id>/*.csv.gz. It
# takes the place of our forecasts for the rounds we submitted.
submitted = "data/our-submissions"
# Each round's submitted model per hub id, written by the submit workflow
# on the submission-ledger branch (submission_ci.submissions) and copied
# here by `--fetch`.
submissions_table = "data/raw/submission-ledger/submissions.csv"
# `apart`: a week a fallback went out under one of our hub ids is scored
# as "<hub id> [<model>]", never mixed with the chain's start (Sam, #768
# item 14). `together` keeps every week under the hub id.
substituted = "apart"
# Locations shown in the plot of each round.
locations = ["CD", "CD-IT", "CD-NK"]
ref = "main"
