# Lint, format and type-check on commit.
# Install the hooks once with `uvx pre-commit install`.
# Ruff and mypy run from the locked uv environments, so they match CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Downloaded, generated and fixture files are left as they are.
      - id: end-of-file-fixer
        exclude: &generated ^(data|results|docs/(generated|figures|examples)|packages/bdbvhub/tests/hub_validation/fixtures|packages/bdbvsubmission/fixtures|workflow/flowlib/static)/
      - id: trailing-whitespace
        exclude: *generated
      # mkdocs.yml uses !!python/name tags for pymdownx.
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(packages|tests|workflow|docs/hooks)/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(packages|tests|workflow|docs/hooks)/
      - id: mypy
        name: mypy
        entry: uv run mypy packages/nowcastutils/src packages/nowcasteval/src packages/nowcastbaselines/src packages/nowcastfoundation/src packages/nowcastrenewal/src packages/nowcastgermany/src packages/nowcastbdbv/src packages/bdbvhub/src
        language: system
        types: [python]
        files: ^packages/
        pass_filenames: false
      - id: ruff-ci
        name: ruff (packages/bdbvsubmission/)
        entry: bash -c 'cd packages/bdbvsubmission && uv run ruff check --fix src tests fixtures && uv run ruff format src tests fixtures'
        language: system
        types: [python]
        files: ^packages/bdbvsubmission/
        pass_filenames: false
      - id: mypy-ci
        name: mypy (packages/bdbvsubmission/)
        entry: bash -c 'cd packages/bdbvsubmission && uv run mypy'
        language: system
        types: [python]
        files: ^packages/bdbvsubmission/
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: uvx --from actionlint-py actionlint
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
