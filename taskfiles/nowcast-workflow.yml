version: "3"

# The workflow itself: its runs, monitor and checks
# (nowcast-workflow).

tasks:

  # The top-level workflow (workflow/Snakefile, workflow/README.md). Each
  # task runs a target; pass more Snakemake options after `--`, such as
  # `task nowcast-foundation:score -- -n` for a dry run or a file to build one output.
  # Every target runs with workflow/profiles/default and this machine's
  # cores and resources less its headroom (flowlib.machine), or with the
  # untracked profile SNAKEMAKE_PROFILE names (see config/profile.example).
  wf:
    internal: true
    vars:
      SNAKEMAKE_PROFILE:
        sh: python3 workflow/flowlib/localconfig.py SNAKEMAKE_PROFILE
    cmds:
      - >-
        {{.SNAKEMAKE}} {{.WF_TARGET}}
        {{if .SNAKEMAKE_PROFILE}}--workflow-profile {{.SNAKEMAKE_PROFILE}}
        {{else}}$(python3 workflow/flowlib/compute.py){{end}}
        {{.CLI_ARGS}}


  all:
    desc: Run every workflow target that writes nothing outside this machine (simulate, finetune, score)
    cmds:
      - task: wf
        vars: {WF_TARGET: all}


  monitor:
    desc: Serve the workflow monitor (Panoptes), every Snakemake run's jobs as they run, and at /dag/ the MONITOR_DAG targets' rule graphs and job DAGs, on MONITOR_HOST and MONITOR_PORT (config/local.env); runs report to MONITOR_URL
    vars:
      HOST:
        sh: python3 workflow/flowlib/localconfig.py MONITOR_HOST
      PORT:
        sh: python3 workflow/flowlib/localconfig.py MONITOR_PORT
      ROOT:
        sh: python3 workflow/flowlib/localconfig.py ROOT
    cmds:
      - mkdir -p "{{.ROOT}}/monitor"
      - >-
        PANOPTES_DB_URL="sqlite:///{{.ROOT}}/monitor/panoptes.db"
        uv run --group paper python workflow/flowlib/monitor_server.py


  dag:
    desc: "Build a target's rule graph and job DAG for the monitor's /dag/ page (task nowcast-workflow:dag -- NAME=TARGET [snakemake options])"
    cmds:
      - uv run --group paper python workflow/flowlib/dag.py {{.CLI_ARGS}}


  tick:
    desc: Run this machine's scheduled workflow targets once (SCHEDULE_TARGETS in config/local.env), with the lock and room checks the coordinator run uses
    cmds:
      - python3 workflow/scripts/tick.py


  run:
    desc: The persistent coordinator run, one tick after another until `touch output/coordinator.stop` (run it once, under nohup or tmux)
    cmds:
      - python3 workflow/scripts/coordinate.py


  rulegraph:
    desc: Draw the workflow's rule graph (TARGET=all by default) as workflow-dag.svg
    cmds:
      - "{{.SNAKEMAKE}} {{.TARGET | default \"all\"}} --rulegraph | dot -Tsvg > workflow-dag.svg"


  progress:
    desc: Show which workflow outputs exist and which would run (TARGET=all by default)
    cmds:
      - "{{.SNAKEMAKE}} {{.TARGET | default \"all\"}} --summary"


  report:
    desc: Write Snakemake's browsable HTML report of the workflow (workflow-report.html)
    cmds:
      - "{{.SNAKEMAKE}} {{.TARGET | default \"all\"}} --report workflow-report.html"


  check:
    desc: Test the workflow's helpers and dry-run every target, as CI does
    cmds:
      - uv run --group paper pytest -q workflow/tests
