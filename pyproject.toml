[project]
name = "bdbv-hub-modelling"
version = "0.1.0"
description = "Renewal-model nowcasts and forecasts for the BDBV Modeling Hub, with data tools and a backtest harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Abbott", email = "sam.abbott@lshtm.ac.uk" }]
requires-python = ">=3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "pyyaml>=6",
  "tabulate>=0.9",
  "tzdata>=2024.1",
  "jax>=0.12.0",
  "nowcastutils",
  "nowcasteval",
  "nowcastbaselines",
  "nowcastfoundation",
  "nowcastrenewal",
  "nowcastgermany",
  "nowcastbdbv",
  "bdbvhub",
]
keywords = [
  "epidemiology",
  "forecasting",
  "nowcasting",
  "hubverse",
  "Ebola",
  "Bundibugyo virus disease",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]

[project.optional-dependencies]
# The PyRenew renewal model (`nowcastrenewal.model`), pinned by SHA.
# PyRenew brings JAX and NumPyro. The package imports without it.
model = [
  "pyrenew @ git+https://github.com/CDCgov/PyRenew@2441cb327d6e563eab0495540cb7467a102c234f",
]

[project.urls]
Homepage = "https://samabbott.co.uk/bdbv-hub-modelling/"
Documentation = "https://samabbott.co.uk/bdbv-hub-modelling/"
Repository = "https://github.com/seabbs/bdbv-hub-modelling"
Issues = "https://github.com/seabbs/bdbv-hub-modelling/issues"

[dependency-groups]
dev = [
  "bdbv-hub-modelling[model]",
  "import-linter>=2.1",
  "mypy>=1.11",
  "pandas-stubs>=2.1",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "types-PyYAML",
]
# Chronos-2 for the foundation models (`nowcastfoundation.forecaster`).
# Brings torch, built for CUDA 12.6 on Linux. A group, not an extra, so the
# fit store's dependency hash of the other models does not change.
chronos = [
    "chronos-forecasting==2.3.2",
    "peft>=0.17",
    "torch>=2.7",
]
docs = [
  "jupytext>=1.19.6",
  "mkdocs-jupyter>=0.27.0",
  "mkdocs-material>=9.5",
  "mkdocs-redirects>=1.2.3",
  "mkdocstrings[python]>=0.26",
]
paper = [
  "panoptes-ui>=1.6,<2",
  "snakefmt>=0.10",
  "snakemake>=9.27,<10",
  "snakemake-executor-plugin-cluster-generic>=1.0.9",
  "snakemake-executor-plugin-slurm>=2.8,<3",
  "snakemake-logger-plugin-panoptes>=0.3,<0.4",
]

[tool.uv]
default-groups = ["dev"]
# The workspace root holds no code of its own: the packages are in
# packages/, and `bdbvhub` installs the `bdbvhub`
# command.
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
nowcastutils = { workspace = true }
nowcasteval = { workspace = true }
nowcastbaselines = { workspace = true }
nowcastfoundation = { workspace = true }
nowcastrenewal = { workspace = true }
bdbvhub = { workspace = true }
nowcastgermany = { workspace = true }
nowcastbdbv = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "D",   # pydocstyle
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
  "C4",  # flake8-comprehensions
  "PT",  # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "NPY", # numpy-specific
  "PD",  # pandas-vet
  "RET", # flake8-return
  "ARG", # unused arguments
]
ignore = [
  "PD010", # `unstack` reads more clearly than `pivot_table` here
]

[tool.ruff.lint.isort]
known-first-party = [
  "nowcastutils",
  "nowcasteval",
  "nowcastbaselines",
  "nowcastfoundation",
  "nowcastrenewal",
  "nowcastgermany",
  "nowcastbdbv",
  "bdbvhub",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test functions are named for what they check; docstrings would repeat it.
"tests/**" = ["D", "PD101"]
"workflow/tests/**" = ["D", "PD101"]
"packages/*/tests/**" = ["D", "PD101"]
# Ported from the hub validation bundle, whose checks are named after
# hubValidations' and are documented in docs/submission/hub-spec.md.
# The small config classes and helpers carry no docstrings.
"packages/bdbvhub/src/bdbvhub/submission/validate.py" = ["D101", "D102", "D103"]
# Method signatures follow PyRenew's, and maths names keep their capitals.
"packages/nowcastrenewal/src/nowcastrenewal/model/**" = ["ARG002", "N803", "N806", "PTH123"]
"packages/nowcastrenewal/src/nowcastrenewal/latent/**" = ["ARG002", "N803", "N806"]
"packages/nowcastrenewal/src/nowcastrenewal/reporting/**" = ["ARG002", "N803", "N806"]
"packages/nowcastrenewal/src/nowcastrenewal/components/**" = ["ARG002", "N803", "N806"]
# The model's tests, from the prototype.
"tests/model/**" = ["D", "PT018", "PD008", "N806", "ARG001"]
"packages/nowcastrenewal/tests/**" = ["D", "PT018", "PD008", "N806", "ARG001"]
"packages/nowcastbdbv/tests/**" = ["D", "PT018", "PD008", "N806", "ARG001"]
# The port's abort tests check R's conditions, not message text.
"packages/nowcastbaselines/tests/baselinenowcast/**" = ["PT011"]

[tool.pytest.ini_options]
# Each package's own tests, then the rest. `tests/` is on the path for
# the shared test helpers (such as `model.r_live`).
testpaths = ["packages/*/tests", "workflow/tests", "tests"]
pythonpath = ["tests"]
# Model fits are slow; `task test-slow` runs them.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow"]
xfail_strict = true
filterwarnings = [
  # Raised inside pandas by `pd.Timedelta(days=...)` with NumPy 2.4.
  "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
]
markers = [
  "network: tests that download from GitHub (deselect with '-m \"not network\"')",
  "slow: model fits, Chronos-2 inference, backtests and other long tests; CI runs them nightly, on dispatch and on PRs labelled full-tests",
]

[tool.coverage.run]
source = [
  "nowcastutils",
  "nowcasteval",
  "nowcastbaselines",
  "nowcastfoundation",
  "nowcastrenewal",
  "nowcastgermany",
  "bdbvhub",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_packages = [
  "nowcastutils",
  "nowcasteval",
  "nowcastbaselines",
  "nowcastrenewal",
  "nowcastfoundation",
  "nowcastgermany",
  "nowcastbdbv",
  "bdbvhub",
]

[[tool.importlinter.contracts]]
name = "Packages import only the packages below them"
type = "layers"
layers = [
  "bdbvhub",
  "nowcastbdbv | nowcastgermany",
  "nowcastfoundation",
  "nowcastrenewal",
  "nowcastbaselines",
  "nowcasteval",
  "nowcastutils",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["packages/*/src"]

[[tool.mypy.overrides]]
# matplotlib's date locators and formatters are untyped.
module = [
  "nowcasteval.plots",
  "nowcasteval.nowcast_plots",
  "bdbvhub.reporting.data_plots",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
  "scipy",
  "scipy.*",
  "matplotlib",
  "matplotlib.*",
  "jax",
  "jax.*",
  "numpyro",
  "numpyro.*",
  "pyrenew",
  "pyrenew.*",
  "chronos",
  "chronos.*",
  "peft",
  "peft.*",
  "torch",
  "torch.*",
  "safetensors",
  "safetensors.*",
  "huggingface_hub",
  "huggingface_hub.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# JAX calls are untyped, so results come back as Any.
module = ["nowcastbaselines.baselinenowcast.*"]
warn_return_any = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# The model subclasses PyRenew's and NumPyro's classes, which are untyped.
module = [
  "nowcastrenewal.model.*",
  "nowcastrenewal.latent.*",
  "nowcastrenewal.reporting.*",
  "nowcastrenewal.components.*",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# The series biases subclass torch's untyped `nn.Module` (torch is optional).
module = ["nowcastfoundation.series_bias"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# The fine-tuning trainer is not typed yet; mypy skips it.
module = [
  "nowcastfoundation.finetune.stream",
]
ignore_errors = true
