name: Site

# Builds the site on pull requests, publishes it as a preview at
# pr-preview/pr-N/ and comments the link (pr-closed.yml removes
# it when the pull request closes). Builds and deploys the site from main.
# Both deploy to the gh-pages branch, which Pages serves. The site and the
# paper also rebuild on a schedule and when evidence/ changes on main, so
# new checkpoint scores reach them without a manual step.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'paper/**'
      - 'evidence/**'
      - 'assets/**'
      - 'packages/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
      - '.github/actions/setup-forecast-env/**'
  pull_request:
    # Opt-in on pull requests: the `full-tests` label.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'paper/**'
      - 'assets/**'
      - 'packages/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
      - '.github/actions/setup-forecast-env/**'
  # Every 6 hours, off the hour and after the fit store's run (30 */6).
  schedule:
    - cron: '43 */6 * * *'
  # A dispatch from main rebuilds and deploys the site. From another
  # branch it builds the site as an artifact only, which is how a branch
  # is checked against a scratch fit store (`store`).
  workflow_dispatch:
    inputs:
      store:
        description: >-
          Fit store to read (blank for fit-store); a scratch store such
          as fit-store-scratch-fm-chronos checks a branch's fits
        type: string
        default: ''
      paper_target:
        description: >-
          The paper workflow's target. `paper` reads the held-out data,
          so its build is never deployed or attached to a release.
        type: choice
        options: [development, paper]
        default: development

permissions:
  contents: read
  # To say on the pages whether a Fit store run is in progress.
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  # Pages only loads and renders, so a newer run cancels the running one
  # on every ref, main included.
  cancel-in-progress: true

env:
  # Chronos-2 runs on the device named here, never a detected one.
  DEVICE: cpu

jobs:
  # The latest hub releases and the stored fits, once, so every job below
  # reads the same data even if a release lands while they run.
  prep:
    name: Hub data and stored fits
    if: >-
      ${{ github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-tests') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # To read the store's artifacts and start Site results.
      actions: write
    outputs:
      ready: ${{ steps.site.outputs.ready }}
    env:
      FIT_STORE: ${{ inputs.store || 'fit-store' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          save-jax: 'false'
      # The latest hub releases, as the Fit store workflow fits them.
      - name: Refresh the hub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run bdbvhub data
          uv run bdbvhub bvd
      # The BDBV backtests (the walks' release snapshot and zone backtests
      # and the pairing sensitivity) and their scores, as Fit store ran and
      # scored them (`backtests` there), unpacked before the stored fits
      # are loaded so the newest fits win. Pages forecasts and scores
      # nothing.
      - name: Load the stored backtests
        run: |
          python3 -I packages/bdbvhub/src/bdbvhub/store/artifact.py \
            fetch output/fit-store backtests site
          if [ ! -f output/fit-store/backtests/latest.json ]; then
            echo "::warning::the fit store holds no backtests yet (Fit store's backtests job writes them); their sections are left out"
            echo "Backtests: not yet stored" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tar -xzf output/fit-store/backtests/latest.tar.gz
          cat output/fit-store/backtests/latest.json >> "$GITHUB_STEP_SUMMARY"
      # What the site shows from the fits and backtests: the stored fits'
      # forecasts as `fit-store load` wrote them, the hub comparison, the
      # German benchmark's tables and the docs figures and tables, as Site
      # results made them (site-results.yml), unpacked last so they win.
      # They may predate the newest fits. With none (not yet made, or
      # expired), nothing is built and the published site stays as it
      # is; on main this starts Site results, which rebuilds the site.
      # Site loads, scores and forecasts nothing.
      - name: Load the stored site results
        id: site
        run: |
          if [ ! -f output/fit-store/site/latest.json ]; then
            echo "::warning::the fit store holds no site results; Site results (site-results.yml) makes them and then rebuilds the site"
            echo "Site results: pending" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF" = refs/heads/main ] && [ "$FIT_STORE" = fit-store ] \
              && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              gh workflow run site-results.yml --ref main -R "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          tar -xzf output/fit-store/site/latest.tar.gz
          cat output/fit-store/site/latest.json >> "$GITHUB_STEP_SUMMARY"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      # The store too, as the Getting started notebook reads a stored fit.
      - if: steps.site.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs
          path: |
            data
            !data/raw
            results
            docs/generated
            docs/figures
            docs/submission/rounds
            output
            !output/fit-store/backtests
            !output/fit-store/site
          retention-days: 1

  build:
    name: Build the site and the paper
    needs: prep
    if: >-
      ${{ !cancelled() && needs.prep.result == 'success'
      && needs.prep.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv and its cache, and JAX's persistent compilation cache.
      - uses: ./.github/actions/setup-forecast-env
        with:
          sync: 'false'
          jax-scope: pages-report
      - run: uv sync --frozen --all-groups
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs
      # The German benchmark's data, for the paper (a download).
      - name: Fetch the German data
        run: uv run nowcastgermany fetch
      # The live fine-tuning run's newest scored checkpoint, read at the
      # checkpoint-scoring branch's head (never a pinned commit).
      - name: The live fine-tuning checkpoint
        run: |
          mkdir -p output/live
          if git fetch -q --depth 1 origin checkpoint-scoring; then
            git show FETCH_HEAD:evidence/checkpoint-scores.csv \
              > output/live/checkpoint-scores.csv || true
          fi
          uv run bdbvhub live-checkpoint \
            --scores output/live/checkpoint-scores.csv \
            --out docs/generated/ft-preliminary.md
      # Scores at each deploy from main, read from the gh-pages branch,
      # with this build's scores last. Only the trees are fetched, and the
      # few distinct summaries as they are read. Without the branch the
      # page says the history is unavailable.
      - name: Score history
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch -q --filter=blob:none --no-tags origin \
            +gh-pages:refs/remotes/origin/gh-pages \
            || echo "::warning::gh-pages could not be fetched"
          uv run score-history --ref origin/gh-pages \
            --docs docs/generated --figures docs/figures \
            --current docs/figures --current-sha "$SHA" \
            --out output/score-history.csv
      - name: Check hub teams are shown on the comparison page only
        run: |
          bad=0
          while read -r name; do
            if grep -q -e OHTJHU -e Chromantis "docs/generated/$name"; then
              echo "::error::docs/generated/$name names a hub team"
              bad=1
            fi
          done < <(grep -o -- '--8<-- "[^"]*"' docs/backtest.md | cut -d'"' -f2)
          exit "$bad"
      # As `task getting-started`. The notebook and its figures are built
      # here, not committed. The filter keeps a tqdm notice about
      # ipywidgets out of the published outputs.
      - name: Run the Getting started notebook
        env:
          PYTHONWARNINGS: 'ignore:IProgress not found'
        run: >-
          uv run --group docs jupytext --to ipynb --execute --run-path .
          docs/getting-started.py
      # The held-out German half is the paper workflow's output (its
      # germany_heldout rule), not forecast here.
      # Quarto reads GH_TOKEN to look up the TinyTeX release, which
      # unauthenticated runners can be refused (403).
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: 1.8.26
          tinytex: true
      # The paper's evaluation workflow, reusing the German benchmark run
      # above, then the paper from its results, for the site's /paper/.
      # Pull requests and pushes run the development target, which never
      # reads the held-out data; the paper target runs only on dispatch.
      # As `task paper`, with the Pages config (paper/workflow/pages.yaml),
      # which leaves out the simulations, fine-tuning runs and their scores
      # that the workflow's hosts make. Their published outputs (the
      # paper-<set>-<hash> release each paper-<set>-main names) are
      # fetched and read as inputs.
      - name: Run the paper workflow and render the paper
        env:
          TARGET: ${{ inputs.paper_target || 'development' }}
          GH_TOKEN: ${{ github.token }}
        # The same steps as `task paper` (workflow/scripts/paper_run.py).
        run: python3 workflow/scripts/paper_run.py --render "$TARGET" --pages
      - name: Build the site into _site
        run: uv run mkdocs build --strict
      # The German page and its data name no held-out nowcast date. Until
      # the site results hold our German scores, the page says they are not
      # yet available and has no data, which passes with a warning.
      - name: Check the German page for held-out dates
        run: uv run germany-site-check _site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          # Read by this run's deploy and preview jobs only.
          retention-days: 3
      # The paper's built inputs, which the `paper-build` job publishes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-build
          path: paper/build
          retention-days: 3
      # The results and data the `release` job may attach, and on a pull
      # request for comparing its results with main's.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: |
            results
            data
            !data/raw
          retention-days: 3

  # Only main deploys: a dispatch from another branch would otherwise
  # replace the site with that branch's build.
  deploy:
    name: Publish the site
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && inputs.paper_target != 'paper'
    # A `paper` build holds the held-out half, which waits for the paper.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      # Pages serves the branch as it is, without Jekyll. Only the root
      # needs this: a preview's copy would survive its removal.
      - run: touch _site/.nojekyll
      # Each package's site at <package>/ is published by the Package docs
      # workflow when the package changes; the deploy keeps those folders.
      - id: keep
        run: |
          {
            echo 'paths<<EOF'
            echo 'pr-preview/'
            for config in packages/*/mkdocs.yml; do
              echo "$(basename "$(dirname "$config")")/"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: ${{ steps.keep.outputs.paths }}
          force: false

  # The paper's built inputs (figures, tables, results.yml and
  # evidence.yml) that this build rendered the site's paper from, as the
  # asset paper-build.tar.gz of the `paper-build` release, replaced at each
  # deploy from main. `task paper:preview` downloads it, so the paper
  # renders locally without its workflow (paper/scripts/fetch_build.py).
  paper-build:
    name: Publish the paper's built inputs
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && inputs.paper_target != 'paper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency: paper-build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paper-build
          path: build
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf paper-build.tar.gz build
          if ! gh release view paper-build -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create paper-build -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --title "Paper build" \
              --notes "The paper's built inputs from the latest Site build."
          fi
          gh release upload paper-build paper-build.tar.gz \
            -R "$GITHUB_REPOSITORY" --clobber
          gh release edit paper-build -R "$GITHUB_REPOSITORY" --notes \
            "The paper's built inputs from the Site build of $GITHUB_SHA ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). \`task paper:preview\` downloads them into paper/build/."

  # Only for branches of this repository: a fork's token cannot write, and
  # it never gets secrets.
  # Each job below names the build's result, as the skipped held-out job
  # upstream would otherwise skip it.
  preview:
    name: Publish the pull request's preview
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency: preview-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  # Attaches every model's results to the round releases that used this
  # build's hub release (bdbvhub.submission.release). Apart from the
  # deploy, so a failure here never holds the site back. Runs no project
  # code. Adding files to an existing release needs no tag, so the
  # workflow token can do it.
  release:
    name: Attach the round's files to its release
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && inputs.paper_target != 'paper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I packages/bdbvhub/src/bdbvhub/submission/release.py attach build _site
