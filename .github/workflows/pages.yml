name: Site

# Builds the site on pull requests, publishes it as a preview at
# pr-preview/pr-N/ and comments the link (pr-closed.yml removes
# it when the pull request closes). Builds and deploys the site from main.
# Both deploy to the gh-pages branch, which Pages serves. The site and the
# paper also rebuild on a schedule and when evidence/ changes on main, so
# new checkpoint scores reach them without a manual step.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'paper/**'
      - 'evidence/**'
      - 'assets/**'
      - 'packages/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
      - '.github/actions/setup-forecast-env/**'
  pull_request:
    # Opt-in on pull requests: the `full-tests` label.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'paper/**'
      - 'assets/**'
      - 'packages/**'
      - 'data/**'
      - 'config/**'
      - 'results/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
      - '.github/actions/setup-forecast-env/**'
  # Every 6 hours, off the hour and after the fit store's run (30 */6).
  schedule:
    - cron: '43 */6 * * *'
  # A dispatch from main rebuilds and deploys the site. From another
  # branch it builds the site as an artifact only, which is how a branch
  # is checked against a scratch fit store (`store_branch`).
  workflow_dispatch:
    inputs:
      store_branch:
        description: >-
          Fit store branch to read (blank for fit-store); a scratch store
          such as fit-store-scratch-fm-chronos checks a branch's fits
        type: string
        default: ''
      paper_target:
        description: >-
          The paper workflow's target. `paper` reads the held-out data,
          so its build is never deployed or attached to a release.
        type: choice
        options: [development, paper]
        default: development

permissions:
  contents: read
  # To say on the pages whether a Fit store run is in progress.
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  # Pages only loads and renders, so a newer run cancels the running one
  # on every ref, main included.
  cancel-in-progress: true

env:
  # Chronos-2 runs on the device named here, never a detected one.
  DEVICE: cpu

jobs:
  # The latest hub releases and the stored fits, once, so every job below
  # reads the same data even if a release lands while they run.
  prep:
    name: Hub data and stored fits
    if: >-
      ${{ github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-tests') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          save-jax: 'false'
      # The latest hub releases, as the Fit store workflow fits them.
      - name: Refresh the hub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run bdbvhub data
          uv run bdbvhub bvd
      # The BDBV backtests (the walks' development and zone backtests and
      # the pairing sensitivity) and their scores, as Fit store ran and
      # scored them (`backtests` there), unpacked before the stored fits
      # are loaded so the newest fits win. Pages forecasts and scores
      # nothing.
      - name: Load the stored backtests
        env:
          FIT_STORE_BRANCH: ${{ inputs.store_branch || 'fit-store' }}
        run: |
          python3 -I packages/bdbvhub/src/bdbvhub/store/branch.py fetch output/fit-store
          bundle=output/fit-store/backtests/latest.tar.gz
          if [ ! -f "$bundle" ]; then
            echo "::warning::the fit store holds no backtests yet (Fit store's backtests job writes them); their sections are left out"
            echo "Backtests: not yet stored" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tar -xzf "$bundle"
          cat output/fit-store/backtests/latest.json >> "$GITHUB_STEP_SUMMARY"
      # Pages never fits a model. The fitted models' forecasts come from
      # the fit store (fit-store.yml), which reruns this build when it has
      # stored new fits. `load` writes them into results/ with a record of
      # the fits used, which each page with their results states.
      - name: Load the stored fits
        env:
          FIT_STORE_BRANCH: ${{ inputs.store_branch || 'fit-store' }}
          # The fine-tuned models list the releases for their checkpoint.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run bdbvhub fit-store load --store output/fit-store
      # The store too, as the Getting started notebook reads a stored fit.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs
          path: |
            data
            !data/raw
            results
            output
            !output/fit-store/backtests
          retention-days: 1

  build:
    name: Build the site and the paper
    needs: prep
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv and its cache, and JAX's persistent compilation cache.
      - uses: ./.github/actions/setup-forecast-env
        with:
          sync: 'false'
          jax-scope: pages-report
      - run: uv sync --frozen --all-groups
      # Pages for the submitted rounds come from the ledger branch that
      # the submission workflow writes. A merged round's page is frozen in
      # its `pages/` and copied as it is.
      - name: Fetch the submission ledger
        run: |
          mkdir -p output/ledger
          if git fetch -q --depth 1 origin submission-ledger; then
            git archive FETCH_HEAD | tar -x -C output/ledger
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs
      # The fine-tuned models' German forecasts, as the workflow's German
      # unit made them: the asset germany-forecasts.tar.gz of the release
      # packages/nowcastfoundation/config/finetune.toml pins (`nowcastgermany
      # ft-tag`), attached by
      # `publish_germany_unit`. No other checkpoint stands in. Development
      # dates only. `concat-results` below stacks them with the other
      # models, so they are scored on the same cells.
      - name: Load the stored fine-tuned German forecasts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/germany-ft-store
          tag=$(uv run nowcastgermany ft-tag)
          if gh release download "$tag" -R "$GITHUB_REPOSITORY" \
            -p germany-forecasts.tar.gz -D output/germany-ft-store; then
            tar -xzf output/germany-ft-store/germany-forecasts.tar.gz \
              -C output/germany-ft-store
          fi
          uv run nowcastgermany ft-load \
            --store output/germany-ft-store \
            --out output/parts/parts-germany-ft-store/germany \
            --note results/germany/ft-checkpoint.json
      - name: Compare with hub forecasts, then the docs figures and tables
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          # A preview's store note names the pull request's head, not the
          # merge commit, in one line; empty outside pull requests.
          PREVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          FIT_STORE_RUN=$(gh run list -R "$GITHUB_REPOSITORY" \
            -w fit-store.yml -b main -s in_progress -L 1 \
            --json url -q '.[0].url // ""')
          export FIT_STORE_RUN
          # The hub's forecasts come over the network, which times out
          # now and then; three tries, a minute apart (#231).
          for try in 1 2 3; do
            uv run bdbvhub compare-hub --fetch && break
            if [ "$try" = 3 ]; then exit 1; fi
            echo "::warning::compare-hub --fetch failed (try $try); retrying"
            sleep 60
          done
          uv run bdbvhub concat-results --out results/germany \
            output/parts/parts-germany-*/germany
          # The hub teams' nowcasts are read, not run, so they are scored
          # here.
          uv run nowcastgermany fetch
          uv run nowcastgermany teams --out results/germany
          uv run nowcastgermany asof --out results/germany
          uv run nowcastgermany paper --results results/germany
          uv run bdbvhub report --ledger output/ledger
          # The live fine-tuning run's newest scored checkpoint, read at
          # the checkpoint-scoring branch's head (never a pinned commit).
          mkdir -p output/live
          if git fetch -q --depth 1 origin checkpoint-scoring; then
            git show FETCH_HEAD:evidence/checkpoint-scores.csv \
              > output/live/checkpoint-scores.csv || true
          fi
          uv run bdbvhub live-checkpoint \
            --scores output/live/checkpoint-scores.csv \
            --out docs/generated/ft-preliminary.md
      # Scores at each deploy from main, read from the gh-pages branch,
      # with this build's scores last. Only the trees are fetched, and the
      # few distinct summaries as they are read. Without the branch the
      # page says the history is unavailable.
      - name: Score history
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch -q --filter=blob:none --no-tags origin \
            +gh-pages:refs/remotes/origin/gh-pages \
            || echo "::warning::gh-pages could not be fetched"
          uv run score-history --ref origin/gh-pages \
            --docs docs/generated --figures docs/figures \
            --current docs/figures --current-sha "$SHA" \
            --out output/score-history.csv
      - name: Check hub teams are shown on the comparison page only
        run: |
          bad=0
          while read -r name; do
            if grep -q -e OHTJHU -e Chromantis "docs/generated/$name"; then
              echo "::error::docs/generated/$name names a hub team"
              bad=1
            fi
          done < <(grep -o -- '--8<-- "[^"]*"' docs/backtest.md | cut -d'"' -f2)
          exit "$bad"
      # As `task getting-started`. The notebook and its figures are built
      # here, not committed. The filter keeps a tqdm notice about
      # ipywidgets out of the published outputs.
      - name: Run the Getting started notebook
        env:
          PYTHONWARNINGS: 'ignore:IProgress not found'
        run: >-
          uv run --group docs jupytext --to ipynb --execute --run-path .
          docs/getting-started.py
      # The held-out German half is the paper workflow's output (its
      # germany_heldout rule), not forecast here.
      # Quarto reads GH_TOKEN to look up the TinyTeX release, which
      # unauthenticated runners can be refused (403).
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: 1.8.26
          tinytex: true
      # The paper's evaluation workflow, reusing the German benchmark run
      # above, then the paper from its results, for the site's /paper/.
      # Pull requests and pushes run the development target, which never
      # reads the held-out data; the paper target runs only on dispatch.
      # As `task paper`; keep the two in step.
      - name: Run the paper workflow and render the paper
        env:
          TARGET: ${{ inputs.paper_target || 'development' }}
        # The same steps as `task paper` (workflow/scripts/paper_run.py).
        run: python3 workflow/scripts/paper_run.py --render "$TARGET"
      - name: Build the site into _site
        run: uv run mkdocs build --strict
      # Each package's own docs site, at <site>/<package>/ (as
      # `task package-docs`).
      - name: Build each package's docs site into _site/<package>
        run: |
          for config in packages/*/mkdocs.yml; do
            package=$(basename "$(dirname "$config")")
            uv run mkdocs build --strict -f "$config" -d "$PWD/_site/$package"
          done
      # The German page and its data name no held-out nowcast date.
      - name: Check the German page for held-out dates
        run: uv run germany-site-check _site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          # Read by this run's deploy and preview jobs only.
          retention-days: 3
      # The results and data the `release` job may attach, and on a pull
      # request for comparing its results with main's.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: |
            results
            data
            !data/raw
          retention-days: 3

  # Only main deploys: a dispatch from another branch would otherwise
  # replace the site with that branch's build.
  deploy:
    name: Publish the site
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && inputs.paper_target != 'paper'
    # A `paper` build holds the held-out half, which waits for the paper.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      # Pages serves the branch as it is, without Jekyll. Only the root
      # needs this: a preview's copy would survive its removal.
      - run: touch _site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

  # Only for branches of this repository: a fork's token cannot write, and
  # it never gets secrets.
  # Each job below names the build's result, as the skipped held-out job
  # upstream would otherwise skip it.
  preview:
    name: Publish the pull request's preview
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency: preview-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  # Attaches every model's results to the round releases that used this
  # build's hub release (bdbvhub.submission.release). Apart from the
  # deploy, so a failure here never holds the site back. Runs no project
  # code. Adding files to an existing release needs no tag, so the
  # workflow token can do it.
  release:
    name: Attach the round's files to its release
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && inputs.paper_target != 'paper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I packages/bdbvhub/src/bdbvhub/submission/release.py attach build _site
