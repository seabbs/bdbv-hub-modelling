name: Lint

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'ci/**'
      - 'tests/**'
      - 'workflow/**'
      - 'paper/**'
      - 'docs/hooks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'ci/**'
      - 'tests/**'
      - 'workflow/**'
      - 'paper/**'
      - 'docs/hooks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/lint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Off main, a newer push cancels the running run. On main the running
  # run finishes and only the newest queued run waits.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The submission CI scripts in ci/, their own uv project.
  lint-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ci/uv.lock
      - run: uv sync --frozen
      - name: Ruff and mypy
        run: |
          uv run ruff check src tests fixtures
          uv run ruff format --check src tests fixtures
          uv run mypy
