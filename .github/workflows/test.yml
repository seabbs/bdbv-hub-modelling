name: Tests

on:
  schedule:
    # Nightly, 05:17 UTC: the full tier (model fits, R replays, smoke runs).
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'config/**'
      - 'results/**'
      - 'hub/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'codecov.yml'
      - '.github/workflows/test.yml'
      - '.github/actions/setup-forecast-env/**'
  pull_request:
    # `labeled`: the `full-tests` label runs the full tier on a PR.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'config/**'
      - 'results/**'
      - 'hub/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'codecov.yml'
      - '.github/workflows/test.yml'
      - '.github/actions/setup-forecast-env/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Off main, a newer push cancels the running run. On main the running
  # run finishes and only the newest queued run waits.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The fast tier, on every push and pull request: every test not marked
  # slow, with no model fits.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The tests read the frozen data in tests/fixtures/data, never the
    # live hub data.
    env:
      BDBV_DATA_DIR: tests/fixtures/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv, the locked environment and the tests' own JAX cache.
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: test
      - name: Tests
        run: >-
          uv run pytest -q --durations=50 --cov=nowcastutils --cov=nowcasteval --cov=nowcastbaselines --cov=nowcastfoundation --cov=nowcastrenewal --cov=nowcastgermany --cov=bdbvhub
          --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: package
          use_oidc: true
          fail_ci_if_error: false

  # The full tier: every test marked slow (model fits, Chronos-2
  # inference, backtests, the recovery fit) and the smoke runs. Nightly,
  # on dispatch, and on a pull request labelled `full-tests`.
  full:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-tests') }}
    env:
      BDBV_DATA_DIR: tests/fixtures/data
      # The fixture's latest vintage. The nowcasts below forecast from it
      # and date their files by it, so the hub's check that the forecast
      # date is on or before the reference date holds whatever the day.
      VINTAGE: '2026-11-08'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: test
      - name: Model fits and other slow tests
        run: uv run pytest -q -m slow --durations=50
      - name: Backtest and nowcast smoke test
        timeout-minutes: 15
        # The backtest never fits the fitted models (their forecasts come
        # from the fit store), so this runs random walk only.
        run: |
          uv run bdbvhubrenewal backtest --models randomwalk \
            --data "$BDBV_DATA_DIR" \
            --output output/backtest --results output/results
          uv run bdbvhubrenewal nowcast --vintage "$VINTAGE" \
            --forecast-date "$VINTAGE"
          uv run bdbvhubrenewal metadata --out output/metadata
      - name: Fit and forecast as the submission CI does (a tiny fit)
        run: |
          uv run bdbvhubrenewal --version
          uv run bdbvhubrenewal fit --model renewal --config main \
            --sampler-json '{"num_chains": 1, "num_warmup": 50, "num_samples": 50}' \
            --out output/fits/main
          uv run bdbvhubrenewal plot-ppc --ppc output/fits/main/ppc.json \
            --out output/fits/main/ppc.png
          uv run bdbvhubrenewal nowcast --config main --fit output/fits/main \
            --vintage "$VINTAGE" --forecast-date "$VINTAGE" \
            --out output/candidates/main
          uv run bdbvhubrenewal plot-submission --out output/candidates/main.png \
            --submission "$(ls output/candidates/main/model-output/*/*.csv)"
          uv run bdbvhubrenewal coherence

  # The tests that skip without torch (Chronos-2 inference, the
  # fine-tune's trainer and offloaded evaluation), with the chronos group,
  # on the runner's CPU. Every test file gated on torch, Chronos, PEFT or
  # transformers is found, so a new one joins without a list to edit.
  chronos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      ${{ github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-tests') }}
    env:
      BDBV_DATA_DIR: tests/fixtures/data
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          sync: 'false'
          jax-scope: chronos
      - name: Install the chronos group
        run: uv sync --frozen --group chronos
      - name: Torch-gated tests
        run: |
          mapfile -t files < <(grep -rlE \
            '(importorskip|find_spec)\("(torch|chronos|peft|transformers)"' \
            tests | sort)
          printf '%s\n' "${files[@]}"
          uv run --no-sync pytest -q -m "" --durations=30 "${files[@]}"

  # Live checks of the simulator's PyRenew components against the R
  # packages they stand in for (tests/model/r_live.py): epinowcast's own
  # Stan functions, primarycensored and the R engine. R_LIVE_REQUIRED
  # makes a missing package fail rather than skip.
  r-live:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-tests') }}
    env:
      R_LIVE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: r-live
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev
      # epinowcast at the engine's pin (packages/nowcastfoundation/r).
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: |
            epinowcast/epinowcast@e084b080
            primarycensored@1.6.0
            any::cmdstanr
            any::jsonlite
            any::pkgload
            any::yaml
            any::data.table
            any::flexsurv
            any::posterior
          dependencies: '"hard"'
      - name: Install CmdStan
        run: Rscript -e 'cmdstanr::install_cmdstan(cores = 2)'
      - name: Live R checks
        run: >-
          uv run pytest -q tests/model/test_pmfs.py
          tests/model/test_latent_components.py
          tests/model/test_latent_process.py
          tests/model/test_reporting_delays.py
          tests/model/test_reporting_triangle.py
          tests/model/test_reporting_effects.py
          tests/model/test_reporting_expectation.py
          tests/model/test_revisions.py

  # The former R engine's testthat suite (packages/nowcastfoundation/r),
  # the reference the simulator's draws and latent step are tested
  # against. Its hard dependencies only.
  engine:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-tests') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: packages/nowcastfoundation/r
          dependencies: '"hard"'
          extra-packages: any::testthat any::withr any::pkgload
      - name: Engine tests
        run: >-
          Rscript -e 'testthat::test_local("packages/nowcastfoundation/r",
          reporter = "summary", stop_on_failure = TRUE)'
