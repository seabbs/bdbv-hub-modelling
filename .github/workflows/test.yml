name: Tests

on:
  schedule:
    # Nightly, 05:17 UTC: the full tier (model fits, R replays, smoke runs).
    - cron: '17 5 * * *'
  workflow_dispatch:
  # A push to next too: the merge loop deletes a PR's branch, which
  # cancels its runs, so each merge into next gets a fast-tier run here.
  push:
    branches: [main, next]
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'workflow/**'
      - 'paper/**'
      - 'config/**'
      - 'results/**'
      - 'hub/**'
      - 'Taskfile.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'codecov.yml'
      - '.github/workflows/test.yml'
      - '.github/actions/setup-forecast-env/**'
  pull_request:
    # `labeled`: the `full-tests` label runs the full tier on a PR.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'workflow/**'
      - 'paper/**'
      - 'config/**'
      - 'results/**'
      - 'hub/**'
      - 'Taskfile.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'codecov.yml'
      - '.github/workflows/test.yml'
      - '.github/actions/setup-forecast-env/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Off main and next, a newer push cancels the running run. On main and
  # next the running run finishes and only the newest queued run waits,
  # so a merge is never left without a verdict by the next one.
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' }}

env:
  # Chronos-2 runs on the device named here, never a detected one.
  DEVICE: cpu

jobs:
  # The fast tier, on every push and pull request: every test not marked
  # slow, with no model fits. The one test job a pull request runs: the
  # package, workflow (with Snakemake's dry runs) and paper tests, under
  # xdist, in at most 15 minutes. Workers steal queued tests, so a slow one
  # does not hold up the end. Coverage, which about doubled the tests'
  # time, is measured on pushes and the schedule, not on pull requests.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tests read the frozen data in tests/fixtures/data, never the
    # live hub data.
    env:
      BDBV_DATA_DIR: tests/fixtures/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv, the locked environment and the tests' own JAX cache.
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: test
      - name: Tests
        run: >-
          uv run --group paper pytest -q -n auto --dist worksteal --durations=30
          --junitxml=pytest-durations.xml
          ${{ github.event_name != 'pull_request' && '--cov=nowcastutils --cov=nowcasteval --cov=nowcastbaselines --cov=nowcastfoundation --cov=nowcastrenewal --cov=nowcastgermany --cov=bdbvhub --cov-report=term-missing --cov-report=xml' || '' }}
      - name: Paper tests
        working-directory: paper
        run: uv run --group paper pytest -q -n auto --dist worksteal --durations=10 tests
      # Every test's time, to find the slow ones (`--durations` prints the
      # slowest only).
      - name: Keep the test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-durations
          path: pytest-durations.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'pull_request' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: package
          use_oidc: true
          fail_ci_if_error: false

  # The full tier: every test marked slow (model fits, Chronos-2
  # inference, backtests, the recovery fit) and the smoke runs. Nightly,
  # on dispatch, and on a pull request labelled `full-tests`.
  full:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-tests') }}
    env:
      BDBV_DATA_DIR: tests/fixtures/data
      # The fixture's latest vintage. The nowcasts below forecast from it
      # and date their files by it, so the hub's check that the forecast
      # date is on or before the reference date holds whatever the day.
      VINTAGE: '2026-11-08'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: test
      # The torch-gated files run in the chronos job, slow tests and all,
      # so they are left out here and no test runs twice.
      - name: Model fits and other slow tests
        run: |
          mapfile -t gated < <(grep -rlE \
            '(importorskip|find_spec)\("(torch|chronos|peft|transformers)"' \
            tests | sort)
          uv run --group paper pytest -q -m slow -n 2 --durations=30 \
            "${gated[@]/#/--ignore=}"
      - name: Backtest and nowcast smoke test
        timeout-minutes: 15
        # The backtest never fits the fitted models (their forecasts come
        # from the fit store), so this runs random walk only.
        run: |
          uv run bdbvhubrenewal backtest --models randomwalk \
            --data "$BDBV_DATA_DIR" \
            --output output/backtest --results output/results
          uv run bdbvhubrenewal nowcast --vintage "$VINTAGE" \
            --forecast-date "$VINTAGE"
          uv run bdbvhubrenewal metadata --out output/metadata
      - name: Fit and forecast as the submission CI does (a tiny fit)
        run: |
          uv run bdbvhubrenewal --version
          uv run bdbvhubrenewal fit --model renewal --config main \
            --sampler-json '{"num_chains": 1, "num_warmup": 50, "num_samples": 50}' \
            --out output/fits/main
          uv run bdbvhubrenewal plot-ppc --ppc output/fits/main/ppc.json \
            --out output/fits/main/ppc.png
          uv run bdbvhubrenewal nowcast --config main --fit output/fits/main \
            --vintage "$VINTAGE" --forecast-date "$VINTAGE" \
            --out output/candidates/main
          uv run bdbvhubrenewal plot-submission --out output/candidates/main.png \
            --submission "$(ls output/candidates/main/model-output/*/*.csv)"
          uv run bdbvhubrenewal coherence

  # The tests that skip without torch (Chronos-2 inference, the
  # fine-tune's trainer and offloaded evaluation), with the chronos group,
  # on the runner's CPU. Every test file gated on torch, Chronos, PEFT or
  # transformers is found, so a new one joins without a list to edit.
  chronos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      ${{ github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-tests') }}
    env:
      BDBV_DATA_DIR: tests/fixtures/data
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          sync: 'false'
          jax-scope: chronos
      - name: Install the chronos group
        run: uv sync --frozen --group chronos
      - name: Torch-gated tests
        run: |
          mapfile -t files < <(grep -rlE \
            '(importorskip|find_spec)\("(torch|chronos|peft|transformers)"' \
            tests | sort)
          printf '%s\n' "${files[@]}"
          uv run --no-sync pytest -q -m "" --durations=30 "${files[@]}"

  # Live checks against the R packages our code stands in for
  # (tests/model/r_live.py): epinowcast's own Stan functions and
  # primarycensored for the simulator's PyRenew components, and
  # baselinenowcast for its port. R_LIVE_REQUIRED makes a missing package
  # fail rather than skip.
  r-live:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-tests') }}
    env:
      R_LIVE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: r-live
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev
      # epinowcast at the commit the simulator's reporting ports, and
      # baselinenowcast 0.2.2 (not on CRAN yet: the commit that set it).
      # fitdistrplus: primarycensored's fitdistdoublecens needs it (a
      # Suggests), for tests/model/test_hub_imputation_delays.py. No
      # comments inside `packages`: pak reads every line as a package.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: |
            epinowcast/epinowcast@e084b080
            epinowcast/baselinenowcast@999d1ad50e27921a4078175d6315bbd655878888
            any::zoo
            primarycensored@1.6.0
            any::cmdstanr
            any::jsonlite
            any::data.table
            any::flexsurv
            any::fitdistrplus
            any::posterior
          dependencies: '"hard"'
      - name: Install CmdStan
        run: Rscript -e 'cmdstanr::install_cmdstan(cores = 2)'
      - name: Live R checks
        run: >-
          uv run pytest -q tests/model/test_pmfs.py
          tests/model/test_latent_epinowcast.py
          tests/model/test_reporting_delays.py
          tests/model/test_hub_imputation_delays.py
          tests/model/test_reporting_triangle.py
          tests/model/test_reporting_effects.py
          tests/model/test_reporting_expectation.py
      # With the slow sampler checks.
      - name: Live baselinenowcast checks
        run: uv run pytest -q -m "" tests/baselinenowcast
