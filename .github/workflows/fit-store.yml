name: Fit store

# Fits each fitted model once per real origin and stores the result on
# the fit-store branch, one file per fit, keyed by a hash of what reaches
# the fit (bdbvhub.store.store.fit_key). `plan` lists the
# keys the store lacks, so only those are fitted: a model code change
# refits every origin, and a new hub release adds one fit per model.
# Pages reads the store and never fits; this workflow rebuilds it when
# fits are stored. The submission (submit.yml) reads the same keys and
# starts this workflow when a round's fits are missing, so the newest
# origin is fitted and stored first, before any backfill.
#
#   plan -> fit-current -> store-current (the newest origin)
#        -> fit-rest -> store-rest (every other origin) -> pages
#
# Only `store` can write, and it runs no project code. Fits are written
# to fit-store from main only. A dispatch from another branch must name
# a scratch store branch (`store_branch`), for testing.

on:
  push:
    branches: [main]
    paths:
      - 'packages/bdbvhub/src/bdbvhub/__init__.py'
      - 'packages/bdbvhub/src/bdbvhub/cli.py'
      - 'packages/nowcastutils/**'
      - 'packages/nowcastbaselines/**'
      - 'packages/nowcastfoundation/src/**'
      - 'packages/nowcastbdbv/src/nowcastbdbv/__init__.py'
      - 'packages/nowcastbdbv/src/nowcastbdbv/data/**'
      - 'packages/bdbvhub/src/bdbvhub/store/__init__.py'
      - 'packages/nowcasteval/src/nowcasteval/__init__.py'
      - 'packages/nowcasteval/src/nowcasteval/backtest.py'
      - 'packages/bdbvhub/src/bdbvhub/store/digest.py'
      - 'packages/nowcasteval/src/nowcasteval/nowcast.py'
      - 'packages/nowcasteval/src/nowcasteval/ppc.py'
      - 'packages/nowcasteval/src/nowcasteval/scoring.py'
      - 'packages/bdbvhub/src/bdbvhub/store/store.py'
      - 'packages/bdbvhub/src/bdbvhub/reporting/__init__.py'
      - 'packages/bdbvhub/src/bdbvhub/submission/__init__.py'
      - 'packages/bdbvhub/src/bdbvhub/submission/fitting.py'
      - 'packages/bdbvhub/src/bdbvhub/models.py'
      - 'packages/nowcastrenewal/src/**'
      # The backtests' code (`backtest`, `backtests`).
      - 'packages/nowcasteval/src/**'
      - 'packages/nowcastbdbv/src/**'
      - 'config/backtest.toml'
      - 'config/finetune.toml'
      - 'ci/policy.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'packages/bdbvhub/src/bdbvhub/store/branch.py'
      - '.github/workflows/fit-store.yml'
  # A pull request only plans, so its summary says how many fits the
  # change will cost on main.
  pull_request:
    paths:
      - 'packages/bdbvhub/src/bdbvhub/__init__.py'
      - 'packages/bdbvhub/src/bdbvhub/cli.py'
      - 'packages/nowcastutils/**'
      - 'packages/nowcastbaselines/**'
      - 'packages/nowcastfoundation/src/**'
      - 'packages/nowcastbdbv/src/nowcastbdbv/__init__.py'
      - 'packages/nowcastbdbv/src/nowcastbdbv/data/**'
      - 'packages/bdbvhub/src/bdbvhub/store/__init__.py'
      - 'packages/nowcasteval/src/nowcasteval/__init__.py'
      - 'packages/nowcasteval/src/nowcasteval/backtest.py'
      - 'packages/bdbvhub/src/bdbvhub/store/digest.py'
      - 'packages/nowcasteval/src/nowcasteval/nowcast.py'
      - 'packages/nowcasteval/src/nowcasteval/ppc.py'
      - 'packages/nowcasteval/src/nowcasteval/scoring.py'
      - 'packages/bdbvhub/src/bdbvhub/store/store.py'
      - 'packages/bdbvhub/src/bdbvhub/reporting/__init__.py'
      - 'packages/bdbvhub/src/bdbvhub/submission/__init__.py'
      - 'packages/bdbvhub/src/bdbvhub/submission/fitting.py'
      - 'packages/bdbvhub/src/bdbvhub/models.py'
      - 'packages/nowcastrenewal/src/**'
      # The backtests' code (`backtest`, `backtests`).
      - 'packages/nowcasteval/src/**'
      - 'packages/nowcastbdbv/src/**'
      - 'config/backtest.toml'
      - 'config/finetune.toml'
      - 'ci/policy.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'packages/bdbvhub/src/bdbvhub/store/branch.py'
      - '.github/workflows/fit-store.yml'
  # New hub releases: a check with nothing new ends after `plan`.
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      store_branch:
        description: >-
          Store branch to write (blank for fit-store, from main only; any
          other name is a scratch store for testing a branch)
        type: string
        default: ''
      models:
        description: Fit only these models (space-separated; blank for all)
        type: string
        default: ''
      origins:
        description: Fit only these origins (space-separated; blank for all)
        type: string
        default: ''
      retry_failed:
        description: Fit again the fits stored as failed
        type: boolean
        default: false

# A running refit is never cancelled: a push while it runs queues one
# run, and a newer push replaces that queued run. Pull requests, scratch
# stores and other branches have their own groups, so they never replace
# a queued main run; pull requests cancel their superseded plans.
concurrency:
  group: fit-store-${{ github.event_name == 'pull_request' && github.ref || inputs.store_branch || (github.ref == 'refs/heads/main' && 'main' || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Chronos-2 runs on the device named here, never a detected one.
  DEVICE: cpu
  STORE: output/fit-store
  FIT_STORE_BRANCH: ${{ inputs.store_branch || 'fit-store' }}

jobs:
  plan:
    name: List the fits the store lacks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      count: ${{ steps.plan.outputs.count }}
      current: ${{ steps.plan.outputs.current }}
      current_count: ${{ steps.plan.outputs.current_count }}
      rest: ${{ steps.plan.outputs.rest }}
      rest_count: ${{ steps.plan.outputs.rest_count }}
      write: ${{ steps.guard.outputs.write }}
      chronos_ft: ${{ steps.finetuned.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Main writes fit-store; a branch writes only a scratch store
      # (fit-store-scratch*); pull requests and other branch runs plan.
      - name: Decide whether this run may write a store
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SCRATCH: ${{ inputs.store_branch }}
        run: |
          write=$(python3 -I packages/bdbvhub/src/bdbvhub/store/branch.py guard "$EVENT" "$REF" "$SCRATCH")
          echo "write=$write" >> "$GITHUB_OUTPUT"
          echo "Writes $FIT_STORE_BRANCH: $write" >> "$GITHUB_STEP_SUMMARY"
      # Restores only: plan compiles nothing, so saving here would take
      # the key before the fit jobs could save what they compile.
      - uses: ./.github/actions/setup-forecast-env
        with:
          save-jax: 'false'
      # The latest hub releases, and the BVDOutbreakSize release each
      # may use. Every fit job reads these files, so all fit the same data.
      - name: Refresh the hub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run bdbvhub data
          uv run bdbvhub bvd
      - name: Fetch the store
        run: python3 -I packages/bdbvhub/src/bdbvhub/store/branch.py fetch "$STORE"
      # The fine-tuned models' checkpoint, resolved once for the run so
      # every fit job keys and loads the same one without listing the
      # releases again.
      - name: Resolve the fine-tuned checkpoint
        id: finetuned
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          hash=$(uv run bdbvhub finetuned-checkpoint)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "BDBV_CHRONOS_FT=$hash" >> "$GITHUB_ENV"
      - name: Plan
        id: plan
        env:
          MODELS: ${{ inputs.models }}
          ORIGINS: ${{ inputs.origins }}
          RETRY: ${{ inputs.retry_failed }}
        run: |
          args=(--store "$STORE" --out matrix.json --keys keys.json)
          # shellcheck disable=SC2206
          [ -n "$MODELS" ] && args+=(--models $MODELS)
          # shellcheck disable=SC2206
          [ -n "$ORIGINS" ] && args+=(--origins $ORIGINS)
          [ "$RETRY" = true ] && args+=(--retry-failed)
          uv run bdbvhub fit-store plan "${args[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Longest fits first, so the short ones fill in behind them and
          # the run takes as long as its longest fit: by model (slowest
          # first, from the last full refit), then newest origin first.
          jq -c '.include |= sort_by(
            ({"renewalbvd": 0, "renewal": 1, "renewalsp": 2}[.model] // 3),
            (.origin | explode | map(-.)))' matrix.json > sorted.json
          mv sorted.json matrix.json
          # The newest origin's fits are fitted and stored first: they are
          # the submission's, and a backfill can take hours.
          newest=$(jq -r '[.include[].origin] | max // ""' matrix.json)
          for part in current rest; do
            op='=='
            [ "$part" = rest ] && op='!='
            jq -c --arg o "$newest" \
              ".include |= map(select(.origin $op \$o))" matrix.json \
              > "$part.json"
            {
              echo "$part=$(cat "$part.json")"
              echo "${part}_count=$(jq '.include | length' "$part.json")"
            } >> "$GITHUB_OUTPUT"
          done
          echo "count=$(jq '.include | length' matrix.json)" >> "$GITHUB_OUTPUT"
      # The fits and the backtests read the same data.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.guard.outputs.write == 'true'
        with:
          name: data
          path: |
            data
            !data/raw
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.guard.outputs.write == 'true' && steps.plan.outputs.count != '0'
        with:
          name: plan
          path: |
            keys.json
            current.json
            rest.json
          retention-days: 3

  # One job per fit, chains in parallel (`chain_method` in each sampler
  # table). Read-only: the fit is handed to `store-current` as an
  # artefact. The newest origin's fits come first.
  fit-current:
    name: Fit ${{ matrix.model }} at ${{ matrix.origin }}
    needs: plan
    if: needs.plan.outputs.write == 'true' && needs.plan.outputs.current_count != '0'
    runs-on: ${{ vars.FIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.current) }}
    steps: &fit-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One JAX cache per model: the first fit of each to finish saves it.
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: fit-${{ matrix.model }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: data
      # The Chronos-2 models need their dependency group and the pinned
      # checkpoint, cached by its revision.
      - name: Install Chronos-2
        if: startsWith(matrix.model, 'fm_chronos_')
        run: uv sync --frozen --group chronos
      - name: Cache the Chronos-2 checkpoint
        if: startsWith(matrix.model, 'fm_chronos_')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: chronos-2-29ec3766d36d6f73f0696f85560a422f50e8498c
      # The fine-tuned models download the LoRA adapter of the newest
      # chronos-ft-* release (or the one config/finetune.toml pins), kept
      # by its hash, which keys the cache. A missing adapter is stored as
      # failed.
      - name: Cache the fine-tuned checkpoints
        if: endsWith(matrix.model, '_ft')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bdbvhubrenewal
          key: chronos-ft-${{ needs.plan.outputs.chronos_ft }}
      # A fit that raises is stored as failed and is not retried until
      # its inputs change or a dispatch sets retry_failed. One that times
      # out is retried next run.
      - name: Fit
        timeout-minutes: 330
        env:
          MODEL: ${{ matrix.model }}
          ORIGIN: ${{ matrix.origin }}
          KEY: ${{ matrix.key }}
          BDBV_CHRONOS_FT: ${{ needs.plan.outputs.chronos_ft }}
        run: |
          if ! uv run bdbvhub fit-store fit --model "$MODEL" \
            --origin "$ORIGIN" --store new; then
            echo "::warning::$MODEL at $ORIGIN failed; stored as failed"
          fi
          test -f "new/$MODEL/$ORIGIN/$KEY.json.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fit-${{ matrix.model }}-${{ matrix.origin }}
          path: new
          retention-days: 3

  # The only jobs that write. They run no project code: each merges its
  # fits' files into the store branch, prunes keys not needed and pushes
  # once.
  store-current:
    name: Store the newest origin's fits
    needs: [plan, fit-current]
    if: >-
      always() && needs.plan.outputs.write == 'true'
      && needs.plan.outputs.current_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fit-*
          path: new
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
      - run: python3 -I packages/bdbvhub/src/bdbvhub/store/branch.py push new keys.json current.json

  # With the longest fits first, 8 runners finish a full refit as soon
  # as 12 (the longest fit, about 4 h). The rest of the 20 are left for
  # the submission and Pages workflows.
  fit-rest:
    name: Fit ${{ matrix.model }} at ${{ matrix.origin }}
    needs: [plan, store-current]
    if: >-
      always() && needs.plan.outputs.write == 'true'
      && needs.plan.outputs.rest_count != '0'
    runs-on: ${{ vars.FIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.rest) }}
    steps: *fit-steps

  store-rest:
    name: Store the other origins' fits
    needs: [plan, fit-rest]
    if: >-
      always() && needs.plan.outputs.write == 'true'
      && needs.plan.outputs.rest_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fit-*
          path: new
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
      - run: python3 -I packages/bdbvhub/src/bdbvhub/store/branch.py push new keys.json rest.json

  # The BDBV backtests of the models that fit nothing (the walks'
  # development and zone backtests and the pairing sensitivity), one job
  # per cell, beside the fits and under the same write guard. Each only
  # forecasts (`--forecast-only`), cached under a hash of the code and
  # data it reads (`bdbvhub digest --model`), so a change to one
  # model reruns only its cells. `backtests` scores them with the stored
  # fits and stores the results; Pages only loads them.
  backtest:
    name: Backtest (${{ matrix.cell }})
    needs: plan
    if: needs.plan.outputs.write == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # How much the walk models' pairing matters (docs/pairing.md):
          # one forecast per origin gives every pairing variant.
          - cell: pairing-bdbv
            model: randomwalknowcast
            with: >-
              packages/nowcasteval/src/nowcasteval/pairing.py
              packages/nowcasteval/src/nowcasteval/scoring.py
              packages/bdbvhub/src/bdbvhub/store/store.py
            run: >-
              uv run bdbvhub pairing-sensitivity --study bdbv
              --out output/parts/pairing
          - cell: zones-randomwalknowcast
            model: randomwalknowcast
            run: >-
              uv run bdbvhub zone-backtest --forecast-only --models randomwalknowcast
          - cell: zones-randomwalk
            model: randomwalk
            run: >-
              uv run bdbvhub zone-backtest --forecast-only --models randomwalk
          - cell: development-randomwalknowcast
            model: randomwalknowcast
            run: >-
              uv run bdbvhub backtest --forecast-only --models randomwalknowcast
          - cell: development-randomwalk
            model: randomwalk
            run: >-
              uv run bdbvhub backtest --forecast-only --models randomwalk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: backtest-${{ matrix.model }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: data
      - name: Hash what this job reads
        id: key
        env:
          CELL: ${{ matrix.cell }}
          MODEL: ${{ matrix.model }}
          RUN: ${{ matrix.run }}
          WITH: >-
            ${{ matrix.with || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          digest=$(uv run bdbvhub digest --model "$MODEL" --text "$RUN" \
            --with $WITH)
          if [ -z "$digest" ]; then
            echo "::error::digest printed nothing; refusing to key the cache"
            exit 1
          fi
          echo "key=backtest-$CELL-$digest" >> "$GITHUB_OUTPUT"
      - name: Restore the outputs
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/parts
          key: ${{ steps.key.outputs.key }}
      - name: Run
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ${{ matrix.run }}
      - name: Save the outputs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/parts
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parts-${{ matrix.cell }}
          path: output/parts
          if-no-files-found: error
          retention-days: 3

  # The backtests scored with the stored fits once the fits are stored,
  # one process per backtest (all at once ran a runner out of memory),
  # then stored on the store branch as backtests/latest.tar.gz, which
  # Pages unpacks.
  # As soon as the backtest cells finish, not behind the model fits
  # (hours): scored with the fits already stored, then Pages rebuilt. The
  # Pages run after the fits are stored (`pages`) shows the new fits.
  backtests:
    name: Score and store the backtests
    needs: [plan, backtest]
    if: >-
      !cancelled() && needs.plan.outputs.write == 'true'
      && needs.backtest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          save-jax: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: data
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: parts-*
          path: output/parts
      - name: Load the stored fits
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BDBV_CHRONOS_FT: ${{ needs.plan.outputs.chronos_ft }}
        run: |
          python3 -I packages/bdbvhub/src/bdbvhub/store/branch.py fetch "$STORE"
          uv run bdbvhub fit-store load --store "$STORE"
      - name: Score
        run: |
          p=output/parts/parts
          uv run bdbvhub score "$p"-development-{randomwalk,randomwalknowcast}
          uv run bdbvhub score "$p"-zones-{randomwalk,randomwalknowcast}
          # The pairing sensitivity's blocks, for docs/pairing.md.
          mkdir -p results/pairing
          cp "$p"-pairing-bdbv/pairing/*.csv.gz results/pairing/
      - name: Store
        run: |
          # Only what this job made or changed, never a committed file,
          # so Pages keeps its own checkout's results.
          git ls-files --others --modified -- results output \
            | grep -v -e '^output/fit-store/' -e '^output/parts/' \
            > "$RUNNER_TEMP/backtests.txt"
          tar -czf "$RUNNER_TEMP/backtests.tar.gz" -T "$RUNNER_TEMP/backtests.txt"
          python3 -I packages/bdbvhub/src/bdbvhub/store/branch.py \
            push-backtests "$RUNNER_TEMP/backtests.tar.gz" "$GITHUB_SHA"
      - name: Rebuild the docs from the stored backtests
        if: github.ref == 'refs/heads/main' && inputs.store_branch == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"

  pages:
    name: Rebuild the docs from the store
    needs: [plan, store-current, store-rest]
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.store-current.result == 'success'
      || needs.store-rest.result == 'success')
      && github.ref == 'refs/heads/main' && inputs.store_branch == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
