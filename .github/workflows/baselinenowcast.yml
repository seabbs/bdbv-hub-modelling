name: baselinenowcast fixtures

# The Python nowcast is checked against fixtures generated by the R
# package baselinenowcast (tests/baselinenowcast/fixtures). This
# job regenerates them with the pinned package version and fails if
# they differ from the committed files beyond the tests' tolerance
# (tests/baselinenowcast/check_fixtures.py), so the fixtures cannot drift
# from the reference implementation.

on:
  push:
    branches: [main]
    paths:
      - 'packages/nowcastbaselines/src/nowcastbaselines/randomwalk.py'
      - 'packages/nowcastbaselines/src/nowcastbaselines/baselinenowcast/**'
      - 'tests/baselinenowcast/*.R'
      - 'tests/baselinenowcast/check_fixtures.py'
      - 'tests/baselinenowcast/fixtures/**'
      - '.github/workflows/baselinenowcast.yml'
  pull_request:
    # Opt-in on pull requests: the `full-tests` label.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/nowcastbaselines/src/nowcastbaselines/randomwalk.py'
      - 'packages/nowcastbaselines/src/nowcastbaselines/baselinenowcast/**'
      - 'tests/baselinenowcast/*.R'
      - 'tests/baselinenowcast/check_fixtures.py'
      - 'tests/baselinenowcast/fixtures/**'
      - '.github/workflows/baselinenowcast.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Off main, a newer push cancels the running run. On main the running
  # run finishes and only the newest queued run waits.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fixtures:
    if: >-
      ${{ github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-tests') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - name: Install baselinenowcast 0.2.2
        run: |
          install.packages(c("remotes", "zoo"))
          # 0.2.2 is not on CRAN yet: the commit that set the version.
          remotes::install_github(
            "epinowcast/baselinenowcast@999d1ad50e27921a4078175d6315bbd655878888"
          )
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate fixtures
        run: |
          Rscript tests/baselinenowcast/baselinenowcast_fixtures.R
          Rscript tests/baselinenowcast/snapshot_fixtures.R
      - name: Fail if the fixtures changed
        run: python3 tests/baselinenowcast/check_fixtures.py tests/baselinenowcast/fixtures
