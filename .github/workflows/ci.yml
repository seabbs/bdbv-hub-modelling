name: CI

# One job per workspace package: built and installed alone with every
# module imported, ruff, ruff format, mypy and its own tests
# (packages/<name>/tests). A pull request runs the jobs of the
# packages its change can reach; a push to main or next, and a dispatch,
# run them all. The repo checks run on every change.

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Off main and next, a newer push cancels the running run. On main and
  # next the running run finishes and only the newest queued run waits.
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' }}

jobs:
  # What no package holds: the import contract between the packages, the
  # lint of the tests, workflow, docs hooks and paper, and the workflows.
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Import contract
        run: uv run lint-imports --no-logo
      - name: Ruff
        if: ${{ !cancelled() }}
        run: |
          uv run ruff check tests workflow docs/hooks
          uv run ruff format --check tests workflow docs/hooks
          # The paper, with its own settings (paper/ruff.toml).
          (cd paper && uv run ruff check . && uv run ruff format --check .)
      - name: actionlint
        if: ${{ !cancelled() }}
        run: uvx --from actionlint-py actionlint
      # Any block of 10 or more lines (comments, docstrings, imports and
      # signatures aside) found twice in the packages' source fails.
      - name: Duplicate code
        if: ${{ !cancelled() }}
        run: |
          mapfile -t files < <(find packages -path '*/src/*.py' | sort)
          uvx --from pylint==3.3.7 symilar -d 10 --ignore-comments \
            --ignore-docstrings --ignore-imports --ignore-signatures \
            "${files[@]}" | tee symilar.txt
          grep -q 'duplicates=0 ' symilar.txt

  # The packages a change reaches.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.legs.outputs.packages }}
      submission: ${{ steps.legs.outputs.submission }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Packages the change reaches
        id: legs
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "$BASE"...HEAD)
          else
            changed=uv.lock
          fi
          packages=$(printf '%s\n' "$changed" |
            python3 tests/packages/legs.py)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Packages: $packages"
          # The submission CI (ci/) and the workflows that drive it.
          submission=false
          if printf '%s\n' "$changed" | grep -qE \
            '^(uv\.lock|ci/|codecov\.yml|\.github/workflows/(ci|submit|fit-candidates)\.yml)'; then
            submission=true
          fi
          echo "submission=$submission" >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    if: ${{ needs.plan.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
      # The tests read the frozen data in tests/fixtures/data, never the
      # live hub data.
      BDBV_DATA_DIR: tests/fixtures/data
      DEVICE: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-forecast-env
        with:
          jax-scope: package-${{ matrix.package }}
      # With only the dependencies its pyproject.toml declares, at the
      # locked versions; the workspace packages it needs from their wheels.
      - name: Install the package alone
        run: |
          uv build --all-packages --out-dir dist
          uv venv alone
          uv export --frozen --package "$PACKAGE" --no-dev --all-extras \
            --no-hashes --no-header --no-annotate > requirements.txt
          grep -v '^-e ' requirements.txt > third-party.txt
          uv pip install --python alone -r third-party.txt
          wheels=()
          while read -r name; do
            wheels+=(dist/"$name"-*.whl)
          done < <(sed -n 's#^-e \./packages/##p' requirements.txt)
          uv pip install --python alone --no-deps "${wheels[@]}"
      - name: Import every module
        # Outside the checkout, so the modules come from the wheels.
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/alone/bin/python" -I \
            "$GITHUB_WORKSPACE/tests/packages/package_alone.py" "$PACKAGE" \
            "$GITHUB_WORKSPACE/packages/$PACKAGE/src/$PACKAGE"
      - name: Ruff and mypy
        if: ${{ !cancelled() }}
        run: |
          uv run ruff check "packages/$PACKAGE"
          uv run ruff format --check "packages/$PACKAGE"
          uv run mypy "packages/$PACKAGE/src"
      # The package's tests not marked slow, across the runner's cores,
      # with coverage on main only (tracing about doubles the tests' time).
      - name: Tests
        if: ${{ !cancelled() }}
        run: |
          uv run --group paper pytest -q -n auto --dist worksteal \
            --durations=10 "packages/$PACKAGE/tests" \
            ${{ github.ref == 'refs/heads/main' && '--cov="$PACKAGE" --cov-report=xml' || '' }}
      - name: Upload coverage to Codecov
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: package
          use_oidc: true
          fail_ci_if_error: false

  # The submission CI scripts in ci/, their own uv project.
  submission:
    needs: plan
    if: ${{ needs.plan.outputs.submission == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ci/uv.lock
      - run: uv sync --frozen
      - name: Ruff and mypy
        run: |
          uv run ruff check src tests fixtures
          uv run ruff format --check src tests fixtures
          uv run mypy
      - name: Tests
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest -q --cov=submission_ci --cov-report=term
          --cov-report=xml
      - name: Upload coverage to Codecov
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ci/coverage.xml
          flags: ci
          use_oidc: true
          fail_ci_if_error: false
      - name: Dry run of the submission workflow on fixtures
        if: ${{ !cancelled() }}
        run: ./run_dry.sh
