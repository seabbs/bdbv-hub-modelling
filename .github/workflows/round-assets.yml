name: Round assets

# Attach Submit runs' artefacts to their rounds' releases: every
# candidate's hub file, checks and run record, the gates' provenance with
# each candidate's hub validation log, and the round's inputs
# (ci/steps/round_assets.sh). release.sh does this as each round is
# released; this backfills past rounds while their runs' artefacts last
# (candidates expire after 7 days, gates after 90).

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Submit run ids, space-separated
        type: string
        required: true
      dry_run:
        description: Only say what would be attached
        type: boolean
        default: true

concurrency:
  group: round-assets
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  WORK: output/ci
  CI_DIR: ci

jobs:
  attach:
    name: Attach run artefacts to round releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Attach each run's artefacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          status=0
          for run in $RUNS; do
            ci/steps/round_assets.sh "$run" || status=1
          done
          exit "$status"
