name: Fit store seed

# Uploads the fit store that the `fit-store` git branch holds as the
# store's artifacts (`fit-store`, `fit-store-backtests` and
# `fit-store-site`), so the store moves to artifacts with nothing
# refitted. Until a store artifact exists, every reader reads the branch
# (packages/bdbvhub/src/bdbvhub/store/artifact.py). Does nothing once one
# exists. Main only.

on:
  workflow_dispatch:

permissions:
  contents: read
  # To read the store's artifacts.
  actions: read

jobs:
  seed:
    name: Upload the branch's store as artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the store from the branch
        id: read
        run: |
          have=$(python3 -I packages/bdbvhub/src/bdbvhub/store/artifact.py latest)
          if [ -n "$have" ]; then
            echo "A store artifact exists ($have): nothing to seed." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "seed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -I packages/bdbvhub/src/bdbvhub/store/artifact.py \
            fetch store backtests site
          for bundle in backtests site; do
            if [ -d "store/$bundle" ]; then
              mv "store/$bundle" "$bundle"
            fi
          done
          echo "seed=true" >> "$GITHUB_OUTPUT"
      - if: steps.read.outputs.seed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fit-store
          path: store
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - if: steps.read.outputs.seed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fit-store-backtests
          path: backtests
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
      - if: steps.read.outputs.seed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fit-store-site
          path: site
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
