version: "3"

# Machine settings (config/local.env) are read only by flowlib.localconfig.

vars:
  SNAKEMAKE: uv run --group paper snakemake

env:
  UV_CACHE_DIR: '{{.UV_CACHE_DIR | default (printf "%s/uvcache" (env "TMPDIR" | default "/tmp"))}}'
  MPLCONFIGDIR: '{{.MPLCONFIGDIR | default (printf "%s/mplconfig" (env "TMPDIR" | default "/tmp"))}}'


# Each Taskfile lives beside its code and runs in its own folder; this one
# only includes them, so every task is found from here: `task
# <namespace>:<task>`, or `task <task>` inside that folder.
includes:
  nowcastutils:
    taskfile: packages/nowcastutils/Taskfile.yml
    dir: packages/nowcastutils
  nowcasteval:
    taskfile: packages/nowcasteval/Taskfile.yml
    dir: packages/nowcasteval
  nowcastbaselines:
    taskfile: packages/nowcastbaselines/Taskfile.yml
    dir: packages/nowcastbaselines
  nowcastrenewal:
    taskfile: packages/nowcastrenewal/Taskfile.yml
    dir: packages/nowcastrenewal
  nowcastfoundation:
    taskfile: packages/nowcastfoundation/Taskfile.yml
    dir: packages/nowcastfoundation
  nowcastgermany:
    taskfile: packages/nowcastgermany/Taskfile.yml
    dir: packages/nowcastgermany
  nowcastbdbv:
    taskfile: packages/nowcastbdbv/Taskfile.yml
    dir: packages/nowcastbdbv
  bdbvhub:
    taskfile: packages/bdbvhub/Taskfile.yml
    dir: packages/bdbvhub
  workflow:
    taskfile: workflow/Taskfile.yml
    dir: workflow
  submission:
    taskfile: packages/bdbvsubmission/Taskfile.yml
    dir: packages/bdbvsubmission
  paper:
    taskfile: paper/Taskfile.yml
    dir: paper

tasks:
  setup:
    desc: Install the package with the dev and docs groups
    cmds:
      - uv sync --all-groups


  test:
    desc: Run the tests with coverage
    cmds:
      - uv run pytest -q --cov=nowcastutils --cov=nowcasteval --cov=nowcastbaselines --cov=nowcastfoundation --cov=nowcastrenewal --cov=nowcastgermany --cov=nowcastbdbv --cov=bdbvhub


  test-slow:
    desc: Run the tests marked slow (model fits and Chronos-2 inference)
    cmds:
      - uv run pytest -q -m slow


  test-all:
    desc: Run every test, the model fit tests included, as the CI does
    cmds:
      - task: test
      - task: test-slow


  lint:
    desc: Lint, check formatting and type-check
    cmds:
      - uv run ruff check packages tests workflow experiments docs/hooks
      - uv run ruff format --check packages tests workflow experiments docs/hooks
      - uv run mypy
      - uv run lint-imports --no-logo


  format:
    desc: Format and fix lint where safe
    cmds:
      - uv run ruff format packages tests workflow experiments docs/hooks
      - uv run ruff check --fix packages tests workflow experiments docs/hooks


  getting-started:
    desc: Run the Getting started notebook again and save its outputs
    cmds:
      - task: bdbvhub:fit-store
      - >-
        uv run --group docs jupytext --to ipynb --execute --run-path .
        docs/getting-started.py


  paper:
    desc: Run the paper workflow (TARGET=development by default, or paper) and render the paper into docs/paper/, as CI does (paper_run.py --render), niced on this machine's cores less its headroom, with start, done or FAILED lines; TARGET=paper waits for the held-out inputs and the final run's final checkpoint
    cmds:
      - uv run --group paper python workflow/scripts/paper_run.py {{.TARGET | default "development"}}


  docs:
    desc: Build the docs site into _site/
    cmds:
      - task: bdbvhub:results
      - task: bdbvhub:plots
      - task: getting-started
      - task: paper
      - uv run mkdocs build --strict
      - task: package-docs

  package-docs:
    desc: Build each package's own docs site into _site/<package>/ (as CI does)
    cmds:
      - for: {var: SITES}
        cmd: >-
          uv run mkdocs build --strict -f {{.ITEM}}
          -d "$PWD/_site/$(basename "$(dirname {{.ITEM}})")"
    vars:
      SITES:
        sh: ls packages/*/mkdocs.yml


  serve:
    desc: Serve the docs locally (run `task bdbvhub:results` once first)
    cmds:
      - task: bdbvhub:plots
      - uv run mkdocs serve

  # Named dry runs: what each would run, without running it.
  dry:tick:
    desc: Dry-run this machine's scheduled workflow targets, as `task workflow:tick` would run them
    cmds:
      - python3 workflow/scripts/tick.py --dry-run

  dry:paper:
    desc: Dry-run the paper workflow's development target
    cmds:
      - uv run --group paper snakemake -s workflow/Snakefile development -n --cores 1 {{.CLI_ARGS}}

  dry:submit:
    desc: Dry run of the submission workflow on fixture data
    cmds:
      - task: submission:dry

  dry:fit-store:
    desc: List the fits the store lacks for this code and data
    cmds:
      - task: bdbvhub:fit-store-plan
