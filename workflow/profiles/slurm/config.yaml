# COMPUTE=slurm (flowlib.compute): every job a Slurm job, through
# snakemake-executor-plugin-slurm, on nodes sharing this checkout and
# ROOT. flowlib.compute adds the default resources and the site's account
# and partitions file (SLURM_ACCOUNT, SLURM_PARTITIONS in
# config/local.env; partitions.example.yaml here). Set-up and launch:
# docs/development/slurm.md.
executor: slurm
jobs: 100
rerun-triggers: [mtime]
printshellcmds: true
keep-going: true
retries: 1
# A shared filesystem shows a node's outputs late.
latency-wait: 120
set-threads:
  - simulate_batch=1
  - train_segment=8
set-resources:
  # A batch is run by count elsewhere and claims no memory there; a
  # Slurm job must, or it gets the whole node or the partition default.
  - simulate_batch:mem_mb=4096
  - simulate_batch:runtime=120
  - train_segment:mem_mb=32768
  - train_segment:runtime=720
  # The forecasting units load Chronos-2 and score a block of tasks.
  - evaluate_base:mem_mb=6144
  - evaluate_base:runtime=240
  - evaluate_checkpoint:mem_mb=6144
  - evaluate_checkpoint:runtime=240
  - seven_day_check:mem_mb=6144
  - seven_day_check:runtime=240
  - score_germany:runtime=240
  - score_run_germany:runtime=240
  - ft_check_forecast:runtime=240
# The caps machine.args sets on one machine, without its cores, memory,
# GPUs and the trainer's kept cores, which Slurm schedules.
resources:
  - sim_slots=100
  - awaiting=1
