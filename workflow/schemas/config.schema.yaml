$schema: "https://json-schema.org/draft/2020-12/schema"
description: >-
  The workflow's settings (workflow/config.yaml), checked when the workflow
  loads (Snakefile). Each section names every key it takes, so a misspelt
  or unknown setting is an error. The paper's settings
  (paper/workflow/config.yaml) load beside these, so other top-level keys
  are left to them.

$defs:
  count:
    type: integer
    minimum: 0
  positive:
    type: integer
    minimum: 1
  # A round number; `--config rounds=[4]` gives it as text.
  round:
    oneOf:
      - {type: integer, minimum: 0}
      - {type: string, pattern: "^[0-9]+$"}
  rounds:
    type: array
    items: {$ref: "#/$defs/round"}
  sources:
    type: array
    items: {type: string}
    minItems: 1
  labels:
    type: array
    items: {type: string}

  # The fine-tuning settings: `finetune`, and each run's entry in `runs`,
  # which takes any of them on top (flowlib.runs.resolve).
  finetune_settings:
    type: object
    additionalProperties: false
    properties:
      prefixes:
        type: array
        items: {$ref: "#/$defs/positive"}
        minItems: 1
      outbreaks: {$ref: "#/$defs/positive"}
      rounds:
        oneOf: [{type: "null"}, {$ref: "#/$defs/rounds"}]
      seed_file: {type: ["null", string]}
      validation_round:
        oneOf: [{type: "null"}, {$ref: "#/$defs/round"}]
      holdout: {$ref: "#/$defs/positive"}
      sims_from: {enum: [local, remote, release]}
      draws: {$ref: "#/$defs/positive"}
      cuts: {$ref: "#/$defs/positive"}
      subset_seed: {type: integer}
      learning_rate: {type: number, exclusiveMinimum: 0}
      bias_lr: {type: number, exclusiveMinimum: 0}
      batch_size: {$ref: "#/$defs/positive"}
      checkpoint_above: {$ref: "#/$defs/count"}
      block_limit: {$ref: "#/$defs/positive"}
      sources:
        oneOf: [{type: "null"}, {$ref: "#/$defs/sources"}]
      univariate_share: {type: number, minimum: 0, maximum: 1}
      loss_horizon_days:
        oneOf: [{type: "null"}, {$ref: "#/$defs/positive"}]
      quiet_min_cases:
        oneOf: [{type: "null"}, {$ref: "#/$defs/count"}]
      chunk: {$ref: "#/$defs/positive"}
      cut_workers: {$ref: "#/$defs/positive"}
      eval_every: {$ref: "#/$defs/positive"}
      by_source_every: {$ref: "#/$defs/positive"}
      eval: {enum: [local, offload]}
      series_bias: {type: boolean}
      layout: {enum: [ragged, complete]}
      release_layer: {type: ["null", string]}
      real_training: {enum: [null, germany]}
      note: {type: string}
      check_at: {$ref: "#/$defs/positive"}

type: object
required:
  - rounds
  - grid_rounds
  - retired_rounds
  - simulate
  - finetune
  - runs
  - train_runs
  - forecast
  - score
  - hub_rounds
  - ft_check
  - memory
  - dashboard
  - huggingface
properties:
  rounds: {$ref: "#/$defs/rounds"}

  grid_rounds:
    type: object
    additionalProperties: false
    required: [rounds, validation_round, test_round, topup_round, sources]
    properties:
      rounds: {$ref: "#/$defs/rounds"}
      validation_round: {$ref: "#/$defs/round"}
      test_round: {$ref: "#/$defs/round"}
      topup_round:
        oneOf: [{type: "null"}, {$ref: "#/$defs/round"}]
      sources: {$ref: "#/$defs/sources"}

  retired_rounds:
    type: object
    additionalProperties: false
    required: [first, last]
    properties:
      first: {$ref: "#/$defs/round"}
      last: {$ref: "#/$defs/round"}

  simulate:
    type: object
    additionalProperties: false
    required: [grid_file, seed_base, batches, batch, draws, repo]
    properties:
      grid_file: {type: string}
      seed_base: {$ref: "#/$defs/count"}
      batches: {$ref: "#/$defs/positive"}
      batch: {$ref: "#/$defs/positive"}
      draws: {$ref: "#/$defs/positive"}
      repo: {type: string, pattern: "^[\\w.-]+/[\\w.-]+$"}

  finetune:
    allOf:
      - $ref: "#/$defs/finetune_settings"
      - required:
          - prefixes
          - outbreaks
          - rounds
          - seed_file
          - validation_round
          - holdout
          - sims_from
          - draws
          - cuts
          - subset_seed
          - learning_rate
          - bias_lr
          - batch_size
          - checkpoint_above
          - block_limit
          - sources
          - univariate_share
          - loss_horizon_days
          - quiet_min_cases
          - chunk
          - cut_workers
          - eval_every
          - by_source_every
          - eval
          - series_bias
          - layout
          - real_training
          - note
          - check_at

  runs:
    type: object
    propertyNames: {pattern: "^[a-z][a-z0-9_-]*$"}
    additionalProperties:
      oneOf: [{type: "null"}, {$ref: "#/$defs/finetune_settings"}]

  train_runs:
    oneOf: [{type: "null"}, {$ref: "#/$defs/labels"}]

  forecast:
    description: >-
      The device and CPU threads of every forecasting job (flowlib.forecast);
      FORECAST_DEVICE and FORECAST_THREADS in config/local.env override them.
    type: object
    additionalProperties: false
    required: [device, threads]
    properties:
      device: {enum: [cpu, cuda, mps]}
      threads: {type: integer, minimum: 1}

  score:
    type: object
    additionalProperties: false
    required:
      - labels
      - published_from
      - skip
      - reference
      - mem_mb
      - evidence
      - checkpoints
      - branch
    properties:
      labels:
        oneOf: [{type: "null"}, {$ref: "#/$defs/labels"}]
      published_from: {type: string}
      skip: {$ref: "#/$defs/labels"}
      reference: {$ref: "#/$defs/labels"}
      mem_mb: {$ref: "#/$defs/positive"}
      evidence: {type: string}
      checkpoints: {type: string}
      branch: {type: string}

  rt_check:
    type: object
    additionalProperties: false
    required: [store, data, out_dir]
    properties:
      store: {type: string}
      data: {type: string}
      out_dir: {type: string}

  hub_rounds:
    type: object
    additionalProperties: false
    required:
      - rounds
      - models
    properties:
      rounds:
        $ref: "#/$defs/positive"
      models:
        type: array
        items: {type: string}
  huggingface:
    description: >-
      publish_hf (rules/publish.smk): dry_run writes the Hub folder without
      uploading; scores is a CSV of relative scores for the model card.
    type: object
    additionalProperties: false
    required: [dry_run, scores]
    properties:
      dry_run: {type: boolean}
      scores: {type: string}
  ft_check:
    type: object
    additionalProperties: false
    required:
      - reference
      - models
      - finetuned
      - checkpoint
    properties:
      reference: {type: string}
      models:
        type: array
        items: {type: string}
      finetuned: {type: string}
      checkpoint: {type: string}
  memory:
    description: >-
      Each job's memory in MB, from peak RSS (workflow/config.yaml).
    type: object
    additionalProperties: false
    required:
      - train_segment
      - ft_check_chronos
      - ft_check
      - evaluate
      - seven_day_check
      - validation_forecasts
    properties:
      train_segment: {type: integer, minimum: 1}
      ft_check_chronos: {type: integer, minimum: 1}
      ft_check: {type: integer, minimum: 1}
      evaluate: {type: integer, minimum: 1}
      seven_day_check: {type: integer, minimum: 1}
      validation_forecasts: {type: integer, minimum: 1}
  dashboard:
    type: object
    additionalProperties: false
    required:
      - references
      - studies
      - levels
      - score_defaults
      - exclude
      - rule
      - held_out
      - mail_filter
      - refresh_every
      - datasets
    properties:
      references:
        type: array
        items:
          type: object
          required: [key]
          properties:
            key: {type: string}
            paper_model: {type: string}
            model: {type: string}
            checkpoint: {type: string}
            role: {enum: [baseline, start, other]}
      studies:
        type: object
        additionalProperties: {type: string}
      levels: {$ref: "#/$defs/labels"}
      score_defaults: {type: object}
      serve: {type: boolean}
      exclude: {type: object}
      rule: {type: string}
      held_out:
        type: object
        additionalProperties: false
        required: [datasets, studies, mail]
        properties:
          datasets: {$ref: "#/$defs/labels"}
          studies: {$ref: "#/$defs/labels"}
          mail: {type: string}
          from:
            type: object
            additionalProperties: {type: string}
      mail_filter: {type: string}
      refresh_every: {$ref: "#/$defs/positive"}
      datasets:
        type: array
        items:
          type: object
          required: [key, label]
          properties:
            key: {type: string}
            label: {type: string}
            unit: {type: string}
