# Settings of the top-level workflow (workflow/Snakefile) that are the
# same on every machine. Machine settings (paths, host name, memory caps)
# are in config/local.env (see config/local.env.example), never here.
# Override any of these with `--config key=value`.

# Simulation rounds to make or read, as round numbers.
rounds: []

# The grid's rounds, validation and test rounds and training sources: a
# run takes these unless `finetune` sets them. The trainer monitors the
# validation round; the test round is fresh seeds, never trained on or
# monitored, and scored only for the final model. A round's number sets
# its seeds and its release `sims-r<N>`, so a round is never simulated
# twice (flowlib.grids): the grid validates on round 33, trains on 34 to
# 37 and tests on 38.
grid_rounds:
  # Six rounds of 800 for 4,800 simulations, not the test round (38).
  rounds: [34, 35, 36, 37, 39, 40]
  validation_round: 33
  test_round: 38
  topup_round: null
  sources: [daily, weekly, 3day, daily+weekly, daily+rolling7, daily+3day,
    daily+rolling3]

# Rounds of earlier versions of the grid, first to last: their seeds and
# sims-r<N> releases are never reused (flowlib.grids). When the grid
# changes, its rounds join these and it takes new ones.
retired_rounds: {first: 9, last: 32}

simulate:
  # The grid the simulator runs: its factors, sampling distributions,
  # shares, floors and sim QC thresholds (nowcastfoundation.simulator
  # reads it).
  grid_file: packages/nowcastfoundation/config/finetune/grid.yaml
  # Round r is `batches` batches from seed `seed_base` + 100 r, each
  # `batch` outbreaks with exactly `draws` observation draws, each drawn
  # independently from the grid: 40 of 20, 800 simulations. A simulation
  # failing the sim QC is drawn again in its batch, so a round stays 800.
  seed_base: 30000
  batches: 40
  batch: 20
  draws: 1
  # GitHub repository of the `sims-r<N>` releases.
  repo: seabbs/bdbv-hub-modelling

finetune:
  # The continuous run, one training
  # segment per prefix (`--until`), in <RUN>/train/n<N>/. Every
  # fine-tuned setting trains on the same 3,200 simulations, its grid's
  # four training rounds, so they compare fairly, with checkpoints
  # doubling from 100.
  prefixes: [100, 200, 400, 800, 1600, 3200, 4800]
  outbreaks: 4800
  # Training seeds: the rounds' batches in seed order, or a fixed list
  # from `seed_file` (one seed a line, in order). The validation round is
  # one whole grid block, and the grid's training rounds the blocks
  # trained on. The trainer monitors the first `holdout` simulations of
  # the validation round; the scoring workflow scores it whole. Unset
  # (null), the rounds, validation round and sources are `grid_rounds`.
  rounds: null
  seed_file: null
  validation_round: null
  holdout: 90
  # Where the batches come from: `local` (this machine's rounds),
  # `remote` (the rounds host's, REMOTE in config/local.env) or `release`
  # (the sims-r<N> releases); SIMS_FROM in config/local.env sets it.
  sims_from: local
  # Chronos-2's recipe: one draw of each simulation cut at `cuts`
  # cut-offs, the learning rate falling linearly to zero over the
  # `outbreaks` simulations, and the series bias at its own rate `bias_lr`.
  draws: 1
  cuts: 32
  subset_seed: 1
  learning_rate: 1.0e-5
  bias_lr: 1.0e-3
  # Series a training step packs blocks up to; part of the recipe and
  # the settings hash.
  batch_size: 256
  # Series above which a training step recomputes activations in
  # backward. Memory and speed only: the steps and the hash stay. A
  # machine with less GPU memory sets it lower (CHECKPOINT_ABOVE in
  # config/local.env, or --config finetune.checkpoint_above=N).
  checkpoint_above: 733
  # Most series in a training or held-out block: the block capacity of
  # the smallest GPU that trains, measured with every block checkpointed,
  # with a margin. A whole system over it is cut into views that each fit
  # (finetune.chronos.system_views). Part of the recipe and the settings
  # hash. A machine with more GPU memory may set it higher (BLOCK_LIMIT
  # in config/local.env), which changes its checkpoints' hash.
  block_limit: 1000
  sources: null
  univariate_share: 0.2
  # Days after the cut-off a training block's horizon, and so the loss,
  # runs to (null: the whole horizon, to four weeks ahead). Checkpoint
  # scoring covers every horizon either way.
  loss_horizon_days: 7
  # Cases a block needs reported across its places in the 28 days up to
  # its cut-off, from what is known at the cut-off, to be trained on
  # (null: keep every block).
  quiet_min_cases: 10
  chunk: 100
  # Processes cutting blocks beside the trainer. The trainer claims them
  # and itself as cores, so jobs beside it fit in what is left. Speed
  # only: the steps and the hash stay.
  cut_workers: 3
  # Steps between the trainer's held-out evaluations: the monitor on the
  # first 100 held-out blocks, and by source (100 blocks a source) on a
  # multiple of it. They only score: the steps trained are the same.
  eval_every: 200
  by_source_every: 200
  # Where the trainer's held-out evaluation runs: `local` (in the trainer)
  # or `offload` (the trainer saves adapter snapshots and the `evaluate`
  # rules score them after each segment, on whichever machine
  # WORKER_GROUPS gives `evaluate`; rules/evaluate.smk). Training is the
  # same either way.
  eval: offload
  series_bias: true
  # The training blocks' layout: ragged (each place's counts to the last
  # complete step and its lag series) or complete (the same blocks
  # without their lag series, so the context ends at the last complete
  # step). Ragged adds nothing to the settings hash.
  layout: ragged
  # The release layer's file (null: none): late release starts and the
  # release cadences, drawn per block at fine-tune time from the
  # simulations already made
  # (packages/nowcastfoundation/config/finetune/release-layer.yaml, a
  # proposal). Unset adds nothing to the settings hash.
  release_layer: null
  # Real-data blocks mixed into the training stream, spread over its
  # chunks (null: none). `germany`: the German triangle's reports before
  # the first scored German date (packages/nowcastgermany/config/germany.toml),
  # so no scored
  # target is trained on (rule real_training_blocks). Unset adds nothing
  # to the settings hash.
  real_training: null
  # What a run trains on: `simulations` (the rounds, as above) or `real`
  # (real data alone: the German development half and the public BDBV
  # releases, packages/nowcastfoundation/config/finetune.toml
  # `[realdata_germany]` and `[realdata_bdbv]`). A real run cuts its
  # blocks (rules/realdata.smk): each slice's forecast task laid out as
  # the fine-tuned model forecasts it, at the data rule's lag count. It
  # trains with `finetune-real` (nowcastfoundation.finetune.realdata)
  # with this recipe (series bias, learning rates, batch size, block
  # limit) in passes over every block, as many as give `target_steps`,
  # at most `max_passes`, the learning rate falling to zero over them.
  # Its prefixes are thousandths of the whole training, each saved as a
  # checkpoint n<N>.
  data: simulations
  # Part of the settings hash: changing it changes every checkpoint's hash.
  note: 4,800 simulations, 32 cuts
  # The checkpoint checked against zero-shot on the held-out simulations.
  check_at: 800

# The fine-tuning runs, by name: each takes `finetune` with its entry's
# keys on top (rounds, seed_file, prefixes, outbreaks, cuts, the recipe),
# and keeps its files in <ROOT>/runs/<name>/ (flowlib.runs). Every run
# takes the same rules through the {run} wildcard.
runs:
  runa: {}
  # Run A without the attention biases (the paper's slots comparison,
  # paper/workflow/config.yaml `comparisons`).
  noslots: {series_bias: false}
  # Run A with only some of the attention biases: the same-place bias
  # alone, and the parent and child biases alone (the paper's attention
  # bias setups, with noslots).
  sameonly: {bias_pairs: [same]}
  parentonly: {bias_pairs: [up, down]}
  # Run A on complete counts, without lag series (the paper's delays
  # comparison).
  nodelays: {layout: complete}
  # Run A with the German real-data blocks mixed in: simulations and
  # German data (the paper's `realdata` comparison). Not the real-only
  # run below.
  realdata: {real_training: germany}
  # Chronos-2 fine-tuned on real data alone (`foundation_real`, the SI's
  # "Fine-tuning on real data"): Run A's recipe, layout and attention
  # biases on the German development half and the BDBV releases. It
  # trains in passes to Run A's steps (its final checkpoint's 82,040,
  # chronos-slots-66a7a630d729), at most 20 passes, with checkpoints at
  # 1/8, 1/4, 1/2 and all of them; the final one is reported, with no
  # choice on real data. Its final checkpoint is released as realdata-ft-<hash>, which `realdata` in
  # packages/nowcastfoundation/config/finetune.toml pins. One target
  # cuts, trains, scores and publishes it: `task workflow:finetune-realonly`
  # (rule finetune_realonly). The paper's `realonly` comparison.
  realonly:
    data: real
    prefixes: [125, 250, 500, 1000]
    target_steps: 82040
    max_passes: 20
    eval: local
    note: real data alone, German development half and BDBV releases
  # Run B: Run A's recipe with the release
  # layer (late release starts and the weekly-release share).
  runb: {release_layer: packages/nowcastfoundation/config/finetune/release-layer.yaml}

# The runs `finetune` trains, scores and reports on (null: every run in
# `runs`), each on a GPU of its own when there are enough, else in this
# order. A run's saved segments are not trained again.
train_runs: [runa, noslots]

# The device and CPU threads of every forecasting job: checkpoint scoring
# (the German units), held-out evaluation, backtests (German, Ebola), hub
# forecasts and the paper's runs (flowlib.forecast). A machine overrides
# them with FORECAST_DEVICE and FORECAST_THREADS in config/local.env.
# With device cuda a job takes a whole GPU (the `gpu` resource), so it
# waits for a free one: jobs never share a GPU.
forecast:
  device: cpu
  threads: 2

score:
  # Checkpoints to score, as labels (`<hash>`, `slots-<hash>`); null takes
  # every checkpoint released from `published_from` (rule release_list).
  # Only checkpoints of the current run, released after this time, are
  # scored. Earlier checkpoints' cached rows stay in the tables.
  labels: null
  published_from: "2026-11-19T15:00:00Z"
  # Checkpoints left out, by label.
  skip: []
  # Labels scored beside every checkpoint: randomwalknowcast and zero-shot
  # Chronos-2.
  reference: [reference]
  # The evidence tables the scores merge into, kept rows of other rules.
  evidence: evidence/checkpoint-scores.csv
  checkpoints: evidence/checkpoints.csv
  # The only branch `land` commits and pushes the tables on.
  branch: checkpoint-scoring
  # Worker processes a German unit splits its chunks of dates over, one
  # thread each: the unit's rule's threads (SCORE_WORKERS in the local
  # config overrides it). Two take the cores one 2-thread unit took, so
  # the held-out evaluation keeps its threads; more take them from it.
  workers: 2
  # The German units' device: cpu, cuda or mps, or null for the
  # checkpoint scoring device (compute.scoring_forecast), a whole GPU
  # once no run trains on it. On the CPU, so the GPU is left to training
  # and the held-out evaluation: an 8 GB GPU runs out of memory on a
  # unit and is slower than two CPU workers.
  device: cpu

hub_rounds:
  # The hub rounds report (rules/report.smk): our last this many submitted
  # rounds against every hub team.
  rounds: 4
  # Our models as the fit store holds them for each round, with their
  # zone runs (`fit-store load --models`), beside what we submitted.
  models: [randomwalknowcast]

ft_check:
  # The BDBV foundation-model check (rules/report.smk, bdbvhub.ftcheck):
  # every hub release forecast by each model, scored together with
  # pairwise relative skill scaled to `reference`. `models` are made once
  # per code change and reused; `finetuned` reruns alone for each
  # checkpoint, `checkpoint`, or
  # packages/nowcastfoundation/config/finetune.toml's when empty. A
  # checkpoint is its release's settings hash as `slots-<hash>` (the
  # release chronos-slots-<hash>), for example slots-08f3982239a3.
  reference: randomwalknowcast
  models: [randomwalknowcast, foundation_zeroshot]
  finetuned: foundation
  checkpoint: ""


dashboard:
  # The fine-tuning and simulations dashboard (task workflow:dashboard;
  # workflow/flowlib/dashboard).
  # serve: true serves it with a run whose targets include finetune,
  # simulate or push (flowlib.dashboard.serve), on
  # DASHBOARD_HOST:DASHBOARD_PORT, showing the runs it trains and their
  # simulations (/sims/), for as long as the coordinator (or that
  # Snakemake run) lives.
  serve: true
  # It shows the workflow's runs (`runs` above), each in <ROOT>/runs/<run>,
  # or those --run NAME picks; the first (the newest to train) is the one
  # the status follows.
  # The paper's live run (paper/workflow/config.yaml `live_run`) is shown
  # as "Fine-tuned (reporting triangle)" whichever run trained last; each
  # other run is named here: its paper model's display name
  # (`paper_model`, default the fine-tuned model) then ", <variant>".
  # A run not named here is "<model> - <its grid> grid".
  run_names:
    noslots: {variant: no attention bias}
    nodelays: {paper_model: foundation_complete}
    realdata: {variant: synthetic and German data}
    realonly: {paper_model: foundation_real}
    runb: {variant: release layer}
  # Reference series, matched on rows by model and checkpoint; --ref adds
  # or replaces one (name=MODEL_REGEX[,checkpoint=..][,label=..][,colour=..]
  # [,role=..]). Role: baseline (scores are relative to it), start (each
  # run's curve starts from it, dashed) or other (dotted, the default).
  references:
    # Each takes its paper model's display name and colour
    # (nowcasteval.labels: MODEL_LABELS, MODEL_STYLES).
    - key: zero
      paper_model: foundation_zeroshot
      model: "^foundation_zeroshot$"
      checkpoint: zero-shot
      role: start
    - key: complete
      paper_model: foundation_zeroshot_complete
      model: "^foundation_zeroshot_complete$"
      checkpoint: zero-shot
    # Zero-shot on baselinenowcast's point nowcast, off until picked; each
    # checkpoint's variants are series of their own beside it
    # (flowlib.dashboard.nowcasts.variant_id).
    - key: zero_baselinenowcast
      paper_model: foundation_zeroshot_baselinenowcast
      model: "^foundation_zeroshot_baselinenowcast$"
      checkpoint: zero-shot
    - key: rw
      paper_model: randomwalknowcast
      # The 7-day sum ending each date.
      model: "^randomwalknowcast$"
      role: baseline
  # Score studies in selector order with their labels, the order of their
  # levels, and the target, score, source and level shown first.
  studies:
    germany: Germany
    held_out: held-out synthetic
  levels: [national, states, age, provinces]
  score_defaults: {target: 7day, metric: wis, source: daily, level: national}
  # Checkpoints no panel shows.
  exclude: {hashes: []}
  # The checkpoint scores' rule shown.
  rule: own-quantile-wis_crps-1000-common
  # Held out of model development: BDBV (Ebola) is entirely held out for
  # the paper, so no panel, selector, table or mailbox line shows its
  # scores or nowcasts; so are the German held-out half and the grid's
  # test round.
  # Datasets and score studies by key; mailbox lines matching `mail`.
  held_out:
    datasets: [bdbv]
    studies: [ebola]
    mail: "\\bebola\\b|\\bBDBV\\b(?![-_])"
    # A dataset's held-out half, from its German config's split date: no
    # nowcast date on or after it is read. The grid's test round
    # (`grid_rounds.test_round`) is never listed with the simulations.
    from: {germany: packages/nowcastgermany/config/germany.toml}
  # Mailbox lines shown (a regular expression).
  mail_filter: "slots|ckpt-scores|fm-finetune|sim round|workflow:"
  # How often the server rebuilds the nowcast panels' data (s).
  refresh_every: 300
  # The nowcast panels' datasets, in selector order. Rows carry quantile,
  # value and truth, from the per-checkpoint forecast folders in
  # SCORE_CACHE/<unit>. sources: the model inputs shown (daily, weekly),
  # or all.
  # target: a line under the panels saying what every model forecasts,
  # a string or one per target (7day, daily).
  # truth: the truth line's caption.
  datasets:
    - key: germany
      label: Germany (development half)
      # The scoring units' cache folder (evaluation.checkpoint.GERMANY_UNIT),
      # in SCORE_CACHE and in each run's own <run>/scores.
      unit: germany-days
      metric: WIS
      truth: >-
        black, each day's value as reported 40 days after it (the truth
        scored); over time, the latest release
      # Germany is daily only (packages/nowcastgermany/config/germany.toml): its
      # models take the
      # daily releases and forecast the hub's 7-day rolling sums.
      sources: [daily]
      # The horizon control. days: every model is drawn and scored over
      # the German config's horizons (the nowcast to forecast_days ahead),
      # so no model shows a different span. ranges: the control's choices,
      # [first, last] day from the nowcast date (null: the end of days),
      # applied to the bands, the scores and the WIS by horizon.
      horizons:
        days: packages/nowcastgermany/config/germany.toml
        ranges:
          all: [null, null]
          nowcast: [null, 0]
          forecast: [1, null]
          week 1 ahead: [1, 7]
          weeks 2-4 ahead: [8, null]
        default: all
      target:
        7day: >-
          the hub's 7-day rolling sums of hospitalisations by date of
          report to the health office
        daily: >-
          each day's hospitalisations by date of report to the health
          office, the daily counts the 7-day sums add up
      groups:
        - {name: national, match: "^DE$"}
        - {name: states, match: "^DE-"}
        - {name: ages, match: "^(\\d\\d-\\d\\d|80\\+)$"}

rt_check:
  # The Rt sense check of a stored renewal fit (rule rt_check,
  # bdbvhub.reporting.rtcheck): the fit-store checkout to read, the tidy
  # hub data with its BVDOutbreakSize cache, and where pages go, as
  # <out_dir>/<model>-<origin>.html.
  store: output/fit-store
  data: data
  out_dir: results/rt-check

huggingface:
  # `publish_hf` (rules/publish.smk): the Hub repository is
  # [huggingface] repo in packages/nowcastfoundation/config/finetune.toml.
  # `dry_run` writes the
  # repository folder without uploading; it is also a dry run while the
  # repository is empty. `scores` is a CSV of the checkpoint's scores
  # relative to reference models for the model card
  # (nowcastfoundation.modelcard.SCORE_COLUMNS); empty leaves them out.
  dry_run: true
  scores: ""
